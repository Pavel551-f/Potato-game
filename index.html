<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Картоха</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
    body {
      background: linear-gradient(180deg, #2e1065, #1e1b4b);
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #error-screen { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #991b1b; z-index: 9999; padding: 20px; color: white; font-family: monospace; font-size: 14px; }

    /* Верхняя панель с балансом */
    .top-balance { position: absolute; top: 14px; left: 14px; display: flex; align-items: center; gap: 10px; background: rgba(0,0,0,0.45); border-radius: 50px; padding: 5px 14px 5px 5px; z-index: 60; cursor: pointer; }
    .top-avatar { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; border: 2px solid #a855f7; background: #4c1d95; }
    .top-balance-text { display: flex; flex-direction: column; }
    .top-balance-label { font-size: 11px; color: #c4b5fd; }
    .top-balance-value { font-size: 16px; font-weight: 700; }

    /* Кнопка языка в правом верхнем углу профиля */
    .lang-btn-top {
      position: absolute; top: 14px; right: 14px;
      display: flex; align-items: center; gap: 6px;
      background: rgba(255,255,255,0.1); border-radius: 20px;
      padding: 8px 14px; cursor: pointer;
      font-weight: 700; font-size: 15px; color: #e9d5ff;
      border: 1px solid rgba(255,255,255,0.2); z-index: 60;
    }
    .lang-btn-top:active { background: rgba(255,255,255,0.2); }

    .screen { flex: 1; display: none; flex-direction: column; overflow-y: auto; }
    .screen.active { display: flex; }

    .main-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding-top: 70px; }
    
    .potato-wrap { width: 220px; height: 220px; cursor: pointer; display: flex; align-items: center; justify-content: center; position: relative; z-index: 10; }
    .potato-wrap img { max-width: 100%; max-height: 100%; object-fit: contain; pointer-events: none; transition: transform 0.1s; }
    .potato-wrap:active img { transform: scale(0.92); }

    .tap-power { margin-top: 16px; font-size: 15px; color: #c4b5fd; }
    .auto-info { margin-top: 10px; font-size: 13px; color: #a78bfa; }

    .tabs { display: flex; gap: 8px; padding: 80px 16px 12px; }
    .tab-btn { flex: 1; padding: 11px 6px; border: none; border-radius: 12px; font-size: 13px; font-weight: 600; background: rgba(255,255,255,0.08); color: #c4b5fd; cursor: pointer; }
    .tab-btn.active { background: linear-gradient(135deg, #c084fc, #a855f7); color: white; }
    .list-content { padding: 0 16px 30px; }
    #screen-quests .list-content { padding-top: 80px; }
    .card { background: rgba(255,255,255,0.09); border-radius: 16px; padding: 16px; margin-bottom: 12px; }
    .card-title { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
    .card-desc { font-size: 13px; color: #c4b5fd; margin-bottom: 12px; }
    .section-title { font-size: 14px; color: #a78bfa; margin: 14px 0 10px; font-weight: 600; }
    .btn { background: linear-gradient(135deg, #c084fc, #a855f7); border: none; color: white; padding: 11px; border-radius: 12px; font-size: 14px; font-weight: 600; width: 100%; cursor: pointer; margin-bottom: 10px; }
    .btn:disabled { background: #4b5563; color: #9ca3af; }

    .profile-content { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 70px 20px 30px; position: relative; }
    .profile-avatar { width: 110px; height: 110px; border-radius: 50%; object-fit: cover; border: 3px solid #a855f7; margin-bottom: 18px; background: #4c1d95; }
    .profile-name { font-size: 22px; font-weight: 700; margin-bottom: 10px; text-align: center; }
    .wood-medal-container { display: none; flex-direction: column; align-items: center; margin-bottom: 20px; }
    .wood-medal { width: 80px; height: 80px; margin-bottom: 5px; }
    .wood-medal-text { font-size: 12px; color: #fbbf24; font-weight: 800; text-transform: uppercase; }
    .profile-bottom { width: 100%; margin-top: auto; }
    .progress-label { font-size: 13px; color: #c4b5fd; margin-bottom: 8px; display: flex; justify-content: space-between; }
    .progress-bar { height: 8px; background: rgba(255,255,255,0.15); border-radius: 10px; overflow: hidden; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, #c084fc, #a855f7); width: 0%; transition: width 0.3s; }
    .progress-hint { font-size: 12px; color: #9ca3af; margin-top: 10px; text-align: center; }

    .rating-container { flex: 1; overflow-y: auto; padding: 80px 16px 100px; }
    .rating-row { display: flex; align-items: center; padding: 16px; border-radius: 16px; margin-bottom: 12px; background: linear-gradient(90deg, rgba(234, 179, 8, 0.15) 0%, rgba(26, 26, 33, 0.8) 100%); border: 1px solid rgba(234, 179, 8, 0.4); }
    .rating-rank { width: 40px; height: 40px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 18px; font-weight: 800; margin-right: 12px; background: #eab308; color: #000; flex-shrink: 0; }
    .rating-avatar { width: 50px; height: 50px; border-radius: 50%; margin-right: 12px; object-fit: cover; background: #333; border: 2px solid #fff; flex-shrink: 0; }
    .rating-info { flex: 1; display: flex; flex-direction: column; }
    .rating-name { font-size: 18px; font-weight: 700; }
    .rating-score { font-size: 14px; color: #fde047; font-weight: 600; margin-top: 4px; }
    .my-rating-box { position: fixed; bottom: 70px; left: 0; right: 0; background: #1a1625; border-top: 1px solid rgba(255,255,255,0.1); padding: 12px 16px; display: flex; align-items: center; z-index: 50; justify-content: center; }
    .my-rating-box .rating-name { color: #a855f7; font-size: 16px; }

    .bottom-menu { height: 70px; background: #1a1625; display: flex; border-top: 1px solid rgba(255,255,255,0.08); z-index: 100; }
    .menu-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; color: #9ca3af; cursor: pointer; }
    .menu-item.active { color: #e9d5ff; }
    .menu-icon { font-size: 22px; }

    .float-text { position: fixed; font-size: 24px; font-weight: 800; color: #f5d0fe; text-shadow: 0 2px 4px rgba(0,0,0,0.5); pointer-events: none; z-index: 100; animation: floatUp 0.8s ease-out forwards; }
    @keyframes floatUp { 0% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -150%) scale(1.5); } }

    /* Модальное окно выбора языка */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; }
    .modal-content { background: #2e1065; padding: 20px; border-radius: 20px; width: 80%; max-width: 300px; text-align: center; border: 1px solid #a855f7; }
    .modal-content h3 { margin-bottom: 15px; font-size: 18px; }
    .modal-btn { background: rgba(255,255,255,0.1); border: 1px solid #a855f7; color: white; padding: 12px; border-radius: 12px; width: 100%; margin-bottom: 10px; font-size: 16px; cursor: pointer; transition: 0.2s; }
    .modal-btn:hover { background: #a855f7; }
  </style>
</head>
<body>

  <div id="error-screen"></div>

  <!-- Модальное окно выбора языка -->
  <div class="modal-overlay" id="langModal">
    <div class="modal-content">
      <h3 data-i18n="lang_title">Выберите язык / Choose language</h3>
      <button class="modal-btn" onclick="changeLang('ru')">🇷🇺 Русский</button>
      <button class="modal-btn" onclick="changeLang('en')">🇬🇧 English</button>
      <button class="modal-btn" style="border-color: #ef4444; color: #ef4444;" onclick="closeLangMenu()" data-i18n="cancel">Отмена / Cancel</button>
    </div>
  </div>

  <!-- Баланс -->
  <div class="top-balance" id="openProfile">
    <img class="top-avatar" id="topAvatar" src="" alt="">
    <div class="top-balance-text">
      <div class="top-balance-label" data-i18n="balance_label">Ваш баланс</div>
      <div class="top-balance-value" id="balance">0.000</div>
    </div>
  </div>

  <!-- ГЛАВНАЯ -->
  <div class="screen active" id="screen-main">
    <div class="main-content">
      <div class="potato-wrap" id="potatoBtn">
        <img src="potato.png" draggable="false" alt="Картошка" style="background: transparent;">
      </div>
      <div class="tap-power"><span data-i18n="tap_label">Тап</span>: <span id="tapPower">0.001</span> ₽</div>
      <div class="auto-info" id="autoInfo" style="display:none;"></div>
    </div>
  </div>

  <!-- УЛУЧШЕНИЯ -->
  <div class="screen" id="screen-upgrades">
    <div class="tabs">
      <button class="tab-btn active" id="tabTap" data-i18n="tab_tap">Ул. тапа</button>
      <button class="tab-btn" id="tabAuto" data-i18n="tab_auto">Ул. автокликера</button>
    </div>
    <div class="list-content" id="upgradesList"></div>
  </div>

  <!-- КВЕСТЫ -->
  <div class="screen" id="screen-quests">
    <div class="list-content" id="questsList"></div>
  </div>

  <!-- РЕЙТИНГ -->
  <div class="screen" id="screen-rating">
    <div class="rating-container" id="leaderboardList"></div>
    <div class="my-rating-box">
       <div class="rating-name" data-i18n="rating_leader">🏆 Вы — Лидер проекта!</div>
    </div>
  </div>

  <!-- ПРОФИЛЬ -->
  <div class="screen" id="screen-profile">
    <div class="profile-content">
      
      <!-- НОВАЯ КНОПКА ЯЗЫКА В ПРАВОМ ВЕРХНЕМ УГЛУ -->
      <div class="lang-btn-top" onclick="openLangMenu()">
        🌐 <span id="currentLangText">RU</span>
      </div>

      <img class="profile-avatar" id="profileAvatar" src="" alt="">
      <div class="profile-name" id="profileName" data-i18n="player">Игрок</div>
      
      <div class="wood-medal-container" id="woodMedalBox">
        <svg class="wood-medal" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <path d="M50 10 C 80 10, 95 30, 90 60 C 85 85, 60 95, 40 90 C 15 85, 5 60, 10 35 C 15 15, 30 10, 50 10 Z" fill="#8B5A2B" stroke="#5C3A21" stroke-width="3"/>
          <ellipse cx="35" cy="40" rx="4" ry="2" fill="#5C3A21" transform="rotate(-20 35 40)"/>
          <ellipse cx="65" cy="55" rx="5" ry="3" fill="#5C3A21" transform="rotate(30 65 55)"/>
          <ellipse cx="45" cy="70" rx="3" ry="2" fill="#5C3A21" transform="rotate(10 45 70)"/>
          <ellipse cx="70" cy="30" rx="3" ry="2" fill="#5C3A21" transform="rotate(-40 70 30)"/>
          <path d="M 20 35 C 30 25, 50 20, 70 25" stroke="#A06B3E" stroke-width="3" fill="none" stroke-linecap="round"/>
        </svg>
        <div class="wood-medal-text" data-i18n="legend">Легенда</div>
      </div>

      <div class="profile-bottom">
        <div class="progress-label"><span data-i18n="total_taps">Всего тапов</span><span id="totalTapsText">0</span></div>
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <div class="progress-hint" data-i18n="taps_hint">Число тапов, чтобы друзья могли посмотреть</div>
        
        <button class="btn" style="margin-top: 20px; background: #10b981;" onclick="withdrawMoney()" data-i18n="withdraw">Вывести средства</button>
        
        <div id="devBtn" style="margin-top: 10px; font-size: 10px; color: #4b5563; text-align: center; cursor: pointer;" data-i18n="dev_btn">Нажми 5 раз для теста</div>
      </div>
    </div>
  </div>

  <!-- НИЖНЕЕ МЕНЮ -->
  <div class="bottom-menu">
    <div class="menu-item active" data-screen="main"><div class="menu-icon">☕</div><div data-i18n="menu_main">Главная</div></div>
    <div class="menu-item" data-screen="upgrades"><div class="menu-icon">⚡</div><div data-i18n="menu_upgrades">Улучшения</div></div>
    <div class="menu-item" data-screen="rating"><div class="menu-icon">🏆</div><div data-i18n="menu_rating">Рейтинг</div></div>
    <div class="menu-item" data-screen="quests"><div class="menu-icon">⏳</div><div data-i18n="menu_quests">Квесты</div></div>
  </div>

  <script>
    window.onerror = function(msg, url, line) {
      var err = document.getElementById('error-screen');
      if(err) {
        err.style.display = 'block';
        err.innerHTML += "<p><b>ОШИБКА:</b> " + msg + "<br>Строка: " + line + "</p>";
      }
      return false;
    };

    // 1. СЛОВАРИ ПЕРЕВОДОВ
    var translations = {
      ru: {
        balance_label: "Ваш баланс", tap_label: "Тап", tab_tap: "Ул. тапа", tab_auto: "Ул. автокликера",
        rating_leader: "🏆 Вы — Лидер проекта!", player: "Игрок", legend: "Легенда",
        total_taps: "Всего тапов", taps_hint: "Число тапов, чтобы друзья могли посмотреть",
        withdraw: "Вывести средства", dev_btn: "Нажми 5 раз для теста",
        menu_main: "Главная", menu_upgrades: "Улучшения", menu_rating: "Рейтинг", menu_quests: "Квесты",
        lang_title: "Выберите язык", cancel: "Отмена", bought: "Куплено", buy_for: "Купить за", 
        buy_prev: "Сначала купи предыдущее", auto_buy: "Купить автокликер", auto_desc: "Даёт +0.0001 ₽ каждые 50 секунд",
        auto_power: "Сила автокликера", auto_speed: "Скорость автокликера", gives: "Даёт", interval: "Интервал",
        sec: "сек", balance: "Баланс", make_taps: "Сделай", taps_word: "тапов", progress: "Прогресс",
        claim: "Забрать", received: "Получено", not_done: "Ещё не выполнено",
        upg_names: ["Улучшенный тап", "Сильный тап", "Мощный тап", "Супер тап", "Мега тап", "Гипер тап", "Ультра тап", "Турбо тап", "Космический тап", "Божественный тап"],
        upg_desc: "Каждый тап даёт"
      },
      en: {
        balance_label: "Your balance", tap_label: "Tap", tab_tap: "Tap Upg.", tab_auto: "Auto Upg.",
        rating_leader: "🏆 You are the Project Leader!", player: "Player", legend: "Legend",
        total_taps: "Total taps", taps_hint: "Number of taps for friends to see",
        withdraw: "Withdraw funds", dev_btn: "Press 5 times to test",
        menu_main: "Main", menu_upgrades: "Upgrades", menu_rating: "Rating", menu_quests: "Quests",
        lang_title: "Choose language", cancel: "Cancel", bought: "Bought", buy_for: "Buy for", 
        buy_prev: "Buy previous first", auto_buy: "Buy Autoclicker", auto_desc: "Gives +0.0001 ₽ every 50 seconds",
        auto_power: "Autoclicker Power", auto_speed: "Autoclicker Speed", gives: "Gives", interval: "Interval",
        sec: "sec", balance: "Balance", make_taps: "Make", taps_word: "taps", progress: "Progress",
        claim: "Claim", received: "Received", not_done: "Not completed yet",
        upg_names: ["Improved Tap", "Strong Tap", "Powerful Tap", "Super Tap", "Mega Tap", "Hyper Tap", "Ultra Tap", "Turbo Tap", "Cosmic Tap", "Divine Tap"],
        upg_desc: "Each tap gives"
      }
    };

    var currentLang = localStorage.getItem('potatoLang') || 'ru';
    var t = translations[currentLang];

    // Применяем переводы к HTML
    function applyTranslations() {
      var elements = document.querySelectorAll('[data-i18n]');
      for(var i = 0; i < elements.length; i++) {
        var key = elements[i].getAttribute('data-i18n');
        if(t[key]) {
          elements[i].innerText = t[key];
        }
      }
      // Обновляем текст на кнопке языка (RU или EN)
      document.getElementById('currentLangText').innerText = currentLang.toUpperCase();
    }

    // Функции меню языка
    function openLangMenu() { document.getElementById('langModal').style.display = 'flex'; }
    function closeLangMenu() { document.getElementById('langModal').style.display = 'none'; }
    function changeLang(lang) {
      localStorage.setItem('potatoLang', lang);
      location.reload(); 
    }

    // Telegram
    var tg = null;
    try {
      if (window.Telegram && window.Telegram.WebApp) {
        tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
      }
    } catch(e) {}

    // Данные (10 уровней тапа)
    var upgradesData = [
      { nameIdx: 0, desc: 0.002, cost: 2.5, value: 0.002 },
      { nameIdx: 1, desc: 0.003, cost: 4, value: 0.003 },
      { nameIdx: 2, desc: 0.004, cost: 8, value: 0.004 },
      { nameIdx: 3, desc: 0.005, cost: 16, value: 0.005 },
      { nameIdx: 4, desc: 0.010, cost: 50, value: 0.010 },
      { nameIdx: 5, desc: 0.020, cost: 100, value: 0.020 },
      { nameIdx: 6, desc: 0.030, cost: 150, value: 0.030 },
      { nameIdx: 7, desc: 0.040, cost: 200, value: 0.040 },
      { nameIdx: 8, desc: 0.050, cost: 250, value: 0.050 },
      { nameIdx: 9, desc: 0.100, cost: 500, value: 0.100 }
    ];
    
    var autoValueData = [
      { level: 1, cost: 50, value: 0.0002 }, { level: 2, cost: 60, value: 0.0003 },
      { level: 3, cost: 70, value: 0.0004 }, { level: 4, cost: 80, value: 0.0005 }
    ];
    var autoSpeedData = [
      { level: 1, cost: 55, interval: 45000 }, { level: 2, cost: 65, interval: 40000 }, { level: 3, cost: 75, interval: 35000 }
    ];
    var questsData = [
      { id: 1, need: 1000, reward: 0.5 },
      { id: 2, need: 5000, reward: 1 },
      { id: 3, need: 10000, reward: 2 },
      { id: 4, need: 15000, reward: 5 },
      { id: 5, need: 20000, reward: 10 }
    ];

    // Сохранения
    var balance = parseFloat(localStorage.getItem('potatoBalance')) || 0;
    var tapValue = parseFloat(localStorage.getItem('tapValue')) || 0.001;
    var maxUpgrade = parseInt(localStorage.getItem('maxUpgrade')) || 0;
    var totalTaps = parseInt(localStorage.getItem('totalTaps')) || 0;
    var claimed = JSON.parse(localStorage.getItem('claimed') || '[]');
    var hasAutoclicker = localStorage.getItem('hasAutoclicker') === 'true';
    var autoValue = parseFloat(localStorage.getItem('autoValue')) || 0.0001;
    var autoInterval = parseInt(localStorage.getItem('autoInterval')) || 50000;
    var autoValueLevel = parseInt(localStorage.getItem('autoValueLevel')) || 0;
    var autoSpeedLevel = parseInt(localStorage.getItem('autoSpeedLevel')) || 0;
    
    var currentTab = 'tap';
    var autoTimer = null;
    var lastTapTime = 0;
    var userPhoto = '';
    var userName = t.player;

    // Элементы
    var balanceEl = document.getElementById('balance');
    var tapPowerEl = document.getElementById('tapPower');
    var potatoBtn = document.getElementById('potatoBtn');
    var upgradesList = document.getElementById('upgradesList');
    var questsList = document.getElementById('questsList');
    var autoInfo = document.getElementById('autoInfo');
    var totalTapsText = document.getElementById('totalTapsText');
    var progressFill = document.getElementById('progressFill');
    var woodMedalBox = document.getElementById('woodMedalBox');

    function save() {
      localStorage.setItem('potatoBalance', balance.toFixed(3));
      localStorage.setItem('tapValue', tapValue.toFixed(3));
      localStorage.setItem('maxUpgrade', maxUpgrade);
      localStorage.setItem('totalTaps', totalTaps);
      localStorage.setItem('claimed', JSON.stringify(claimed));
      localStorage.setItem('hasAutoclicker', hasAutoclicker);
      localStorage.setItem('autoValue', autoValue.toFixed(4));
      localStorage.setItem('autoInterval', autoInterval);
      localStorage.setItem('autoValueLevel', autoValueLevel);
      localStorage.setItem('autoSpeedLevel', autoSpeedLevel);
    }

    function updateUI() {
      balanceEl.innerText = balance.toFixed(3);
      tapPowerEl.innerText = tapValue.toFixed(3);
      totalTapsText.innerText = totalTaps;
      progressFill.style.width = Math.min(100, (totalTaps / 20000) * 100) + '%';
      save();
    }

    function updateAutoInfo() {
      if (hasAutoclicker) {
        autoInfo.style.display = 'block';
        var text = currentLang === 'ru' 
          ? 'Автокликер: +' + autoValue.toFixed(4) + ' ₽ каждые ' + (autoInterval / 1000) + ' сек'
          : 'Autoclicker: +' + autoValue.toFixed(4) + ' ₽ every ' + (autoInterval / 1000) + ' sec';
        autoInfo.innerText = text;
      } else {
        autoInfo.style.display = 'none';
      }
    }

    function startAutoclicker() {
      if (autoTimer) clearInterval(autoTimer);
      if (!hasAutoclicker) return;
      autoTimer = setInterval(function() {
        balance += autoValue;
        updateUI();
      }, autoInterval);
    }

    function handleTap(e) {
      var now = Date.now();
      if (now - lastTapTime < 50) return;
      lastTapTime = now;

      if (e.cancelable) e.preventDefault();
      if (tg && tg.HapticFeedback) {
        try { tg.HapticFeedback.impactOccurred('light'); } catch(err) {}
      }

      balance += tapValue;
      totalTaps += 1;
      updateUI();

      var float = document.createElement('div');
      float.className = 'float-text';
      float.innerText = '+' + tapValue.toFixed(3);
      
      var clientX = window.innerWidth / 2;
      var clientY = window.innerHeight / 2;
      if (e.touches && e.touches[0]) {
        clientX = e.touches[0].clientX;
        clientY = e.touches[0].clientY;
      } else if (e.clientX) {
        clientX = e.clientX;
        clientY = e.clientY;
      }

      float.style.left = clientX + 'px';
      float.style.top = clientY + 'px';
      
      document.body.appendChild(float);
      setTimeout(function() { if (float.parentNode) float.parentNode.removeChild(float); }, 800);
    }

    if (potatoBtn) {
      potatoBtn.addEventListener('touchstart', handleTap, { passive: false });
      potatoBtn.addEventListener('mousedown', handleTap);
    }

    function renderUpgrades() {
      upgradesList.innerHTML = '';
      if (currentTab === 'tap') {
        for (var i = 0; i < upgradesData.length; i++) {
          var upg = upgradesData[i];
          var level = i + 1;
          var isBought = level <= maxUpgrade;
          var isNext = level === maxUpgrade + 1;
          
          var btnText = isBought ? t.bought : (isNext ? t.buy_for + ' ' + upg.cost + ' ₽' : t.buy_prev);
          var upgName = t.upg_names[i];
          var upgDesc = t.upg_desc + ' ' + upg.desc.toFixed(3) + ' ₽';
          
          var card = document.createElement('div'); card.className = 'card';
          card.innerHTML = '<div class="card-title">' + upgName + '</div><div class="card-desc">' + upgDesc + '</div>';
          
          var btn = document.createElement('button');
          btn.className = 'btn';
          btn.innerText = btnText;
          if (!isNext) btn.disabled = true;

          if (isNext) {
            btn.onclick = (function(u, lvl) {
              return function() {
                if (balance >= u.cost) {
                  balance -= u.cost; tapValue = u.value; maxUpgrade = lvl;
                  updateUI(); renderUpgrades();
                  if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                } else alert(t.buy_prev);
              };
            })(upg, level);
          }
          card.appendChild(btn); upgradesList.appendChild(card);
        }
      } else {
        if (!hasAutoclicker) {
          var card = document.createElement('div'); card.className = 'card';
          card.innerHTML = '<div class="card-title">' + t.auto_buy + '</div><div class="card-desc">' + t.auto_desc + '</div>';
          var btn = document.createElement('button'); btn.className = 'btn'; btn.innerText = t.buy_for + ' 100 ₽';
          btn.onclick = function() {
            if (balance >= 100) {
              balance -= 100; hasAutoclicker = true;
              updateUI(); updateAutoInfo(); startAutoclicker(); renderUpgrades();
            } else alert(t.buy_prev);
          };
          card.appendChild(btn); upgradesList.appendChild(card);
        } else {
          var t1 = document.createElement('div'); t1.className = 'section-title'; t1.innerText = t.auto_power; upgradesList.appendChild(t1);
          for (var v = 0; v < autoValueData.length; v++) {
            var av = autoValueData[v];
            var isB = autoValueLevel >= av.level; var isN = autoValueLevel + 1 === av.level;
            var card = document.createElement('div'); card.className = 'card';
            card.innerHTML = '<div class="card-title">' + t.auto_power + ' Lv.' + av.level + '</div><div class="card-desc">' + t.gives + ' ' + av.value + ' ₽</div>';
            var btn = document.createElement('button'); btn.className = 'btn';
            btn.innerText = isB ? t.bought : (isN ? t.buy_for + ' ' + av.cost + ' ₽' : t.buy_prev);
            if (!isN) btn.disabled = true;
            if (isN) {
              btn.onclick = (function(a) {
                return function() {
                  if (balance >= a.cost) {
                    balance -= a.cost; autoValue = a.value; autoValueLevel = a.level;
                    updateUI(); updateAutoInfo(); startAutoclicker(); renderUpgrades();
                  } else alert(t.buy_prev);
                };
              })(av);
            }
            card.appendChild(btn); upgradesList.appendChild(card);
          }
          var t2 = document.createElement('div'); t2.className = 'section-title'; t2.innerText = t.auto_speed; upgradesList.appendChild(t2);
          for (var s = 0; s < autoSpeedData.length; s++) {
            var as = autoSpeedData[s];
            var isB = autoSpeedLevel >= as.level; var isN = autoSpeedLevel + 1 === as.level;
            var card = document.createElement('div'); card.className = 'card';
            card.innerHTML = '<div class="card-title">' + t.auto_speed + ' Lv.' + as.level + '</div><div class="card-desc">' + t.interval + ': ' + (as.interval/1000) + ' ' + t.sec + '</div>';
            var btn = document.createElement('button'); btn.className = 'btn';
            btn.innerText = isB ? t.bought : (isN ? t.buy_for + ' ' + as.cost + ' ₽' : t.buy_prev);
            if (!isN) btn.disabled = true;
            if (isN) {
              btn.onclick = (function(a) {
                return function() {
                  if (balance >= a.cost) {
                    balance -= a.cost; autoInterval = a.interval; autoSpeedLevel = a.level;
                    updateUI(); updateAutoInfo(); startAutoclicker(); renderUpgrades();
                  } else alert(t.buy_prev);
                };
              })(as);
            }
            card.appendChild(btn); upgradesList.appendChild(card);
          }
        }
      }
    }

    function renderQuests() {
      questsList.innerHTML = '';
      for (var i = 0; i < questsData.length; i++) {
        var q = questsData[i];
        var isClaimed = claimed.indexOf(q.id) !== -1;
        var canClaim = !isClaimed && totalTaps >= q.need;
        
        var titleText = currentLang === 'ru' ? 'Натапать ' + q.need + ' раз' : 'Tap ' + q.need + ' times';
        var descText = t.make_taps + ' ' + q.need + ' ' + t.taps_word;
        var progText = t.progress + ': ' + Math.min(totalTaps, q.need) + ' / ' + q.need;
        
        var card = document.createElement('div'); card.className = 'card';
        card.innerHTML = '<div class="card-title">' + titleText + '</div><div class="card-desc">' + descText + '</div><div style="margin-bottom: 10px; color: #e9d5ff;">' + progText + '</div>';
        
        var btn = document.createElement('button'); btn.className = 'btn';
        if (isClaimed) { btn.innerText = t.received; btn.disabled = true; }
        else if (canClaim) {
          btn.innerText = t.claim + ' (+' + q.reward + ' ₽)';
          btn.onclick = (function(quest) {
            return function() {
              balance += quest.reward; claimed.push(quest.id);
              updateUI(); renderQuests();
              if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            };
          })(q);
        } else { btn.innerText = t.not_done; btn.disabled = true; }
        card.appendChild(btn); questsList.appendChild(card);
      }
    }

    function renderRating() {
      var container = document.getElementById('leaderboardList');
      container.innerHTML = '';
      var row = document.createElement('div');
      row.className = 'rating-row';
      var avatarSrc = userPhoto ? userPhoto : 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="50" fill="%234c1d95"/><text x="50" y="62" font-size="40" text-anchor="middle" fill="white">🥔</text></svg>';
      
      row.innerHTML = '<div class="rating-rank">1</div><img class="rating-avatar" src="' + avatarSrc + '" alt=""><div class="rating-info"><div class="rating-name">' + userName + '</div><div class="rating-score">' + t.balance + ': ' + balance.toFixed(3) + ' ₽</div></div>';
      container.appendChild(row);
    }

    function loadUser() {
      var photo = '';
      try {
        if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
          var u = tg.initDataUnsafe.user;
          if (u.photo_url) photo = u.photo_url;
          if (u.username) userName = '@' + u.username;
          else if (u.first_name) userName = u.first_name;
        }
      } catch(e) {}

      if (!photo) photo = 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="50" fill="%234c1d95"/><text x="50" y="62" font-size="40" text-anchor="middle" fill="white">🥔</text></svg>';
      
      userPhoto = photo;
      document.getElementById('topAvatar').src = photo;
      document.getElementById('profileAvatar').src = photo;
      document.getElementById('profileName').innerText = userName;

      if (claimed.indexOf(5) !== -1) {
        woodMedalBox.style.display = 'flex';
      } else {
        woodMedalBox.style.display = 'none';
      }
    }

    function showScreen(name) {
      var screens = document.querySelectorAll('.screen');
      for (var s = 0; s < screens.length; s++) screens[s].classList.remove('active');
      var target = document.getElementById('screen-' + name);
      if (target) target.classList.add('active');

      var menuItems = document.querySelectorAll('.menu-item');
      for (var m = 0; m < menuItems.length; m++) {
        menuItems[m].classList.remove('active');
        if (menuItems[m].getAttribute('data-screen') === name) menuItems[m].classList.add('active');
      }

      if (name === 'upgrades') renderUpgrades();
      if (name === 'quests') renderQuests();
      if (name === 'profile') loadUser();
      if (name === 'rating') renderRating();
    }

    document.getElementById('openProfile').onclick = function() { showScreen('profile'); };
    
    var menuItems = document.querySelectorAll('.menu-item');
    for (var i = 0; i < menuItems.length; i++) {
      menuItems[i].onclick = function() { showScreen(this.getAttribute('data-screen')); };
    }

    document.getElementById('tabTap').onclick = function() {
      currentTab = 'tap'; this.classList.add('active');
      document.getElementById('tabAuto').classList.remove('active');
      renderUpgrades();
    };

    document.getElementById('tabAuto').onclick = function() {
      currentTab = 'auto'; this.classList.add('active');
      document.getElementById('tabTap').classList.remove('active');
      renderUpgrades();
    };

    window.withdrawMoney = function() {
      if (balance < 10) { alert(currentLang === 'ru' ? 'Минимум 10 ₽' : 'Minimum 10 ₽'); return; }
      alert((currentLang === 'ru' ? 'Вывод ' : 'Withdraw ') + balance.toFixed(2) + ' ₽ (test)');
      balance = 0; updateUI();
    };

    var devClickCount = 0;
    document.getElementById('devBtn').onclick = function() {
      devClickCount++;
      if (devClickCount >= 5) {
        balance += 1000; totalTaps += 20000; updateUI();
        alert(currentLang === 'ru' ? '+1000 ₽ и +20000 тапов для тестов!' : '+1000 ₽ and +20000 taps for tests!');
        devClickCount = 0;
      }
    };

    // ЗАПУСК
    applyTranslations(); 
    loadUser();
    updateUI();
    updateAutoInfo();
    if (hasAutoclicker) startAutoclicker();
  </script>
</body>
</html>
