<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Картоха</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
    body {
      background: linear-gradient(180deg, #2e1065, #1e1b4b);
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Скрытый экран для ошибок */
    #error-screen {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: #991b1b; z-index: 9999; padding: 20px; overflow-y: auto;
      font-family: monospace; color: white; font-size: 12px;
    }

    .top-balance {
      position: absolute; top: 14px; left: 14px; display: flex; align-items: center;
      gap: 10px; background: rgba(0,0,0,0.45); border-radius: 50px; padding: 5px 14px 5px 5px; z-index: 60;
      cursor: pointer;
    }
    .top-avatar { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; border: 2px solid #a855f7; background: #4c1d95; }
    .top-balance-text { display: flex; flex-direction: column; }
    .top-balance-label { font-size: 11px; color: #c4b5fd; }
    .top-balance-value { font-size: 16px; font-weight: 700; }

    .screen { flex: 1; display: none; flex-direction: column; overflow-y: auto; }
    .screen.active { display: flex; }

    /* ГЛАВНАЯ */
    .main-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding-top: 70px; }
    .potato-wrap { width: 220px; height: 220px; cursor: pointer; display: flex; align-items: center; justify-content: center; position: relative; z-index: 10; }
    .potato-wrap img { max-width: 100%; max-height: 100%; object-fit: contain; pointer-events: none; transition: transform 0.1s; border-radius: 20px; }
    .potato-wrap:active img { transform: scale(0.92); }

    .tap-power { margin-top: 16px; font-size: 15px; color: #c4b5fd; }
    .auto-info { margin-top: 10px; font-size: 13px; color: #a78bfa; }

    /* УЛУЧШЕНИЯ И КВЕСТЫ */
    .tabs { display: flex; gap: 8px; padding: 80px 16px 12px; }
    .tab-btn { flex: 1; padding: 11px 6px; border: none; border-radius: 12px; font-size: 13px; font-weight: 600; background: rgba(255,255,255,0.08); color: #c4b5fd; cursor: pointer; }
    .tab-btn.active { background: linear-gradient(135deg, #c084fc, #a855f7); color: white; }
    .list-content { padding: 0 16px 30px; }
    #screen-quests .list-content { padding-top: 80px; }
    .card { background: rgba(255,255,255,0.09); border-radius: 16px; padding: 16px; margin-bottom: 12px; }
    .card-title { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
    .card-desc { font-size: 13px; color: #c4b5fd; margin-bottom: 12px; }
    .section-title { font-size: 14px; color: #a78bfa; margin: 14px 0 10px; font-weight: 600; }
    .btn { background: linear-gradient(135deg, #c084fc, #a855f7); border: none; color: white; padding: 11px; border-radius: 12px; font-size: 14px; font-weight: 600; width: 100%; cursor: pointer; }
    .btn:disabled { background: #4b5563; color: #9ca3af; }

    /* ПРОФИЛЬ */
    .profile-content { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 70px 20px 30px; }
    .profile-avatar { width: 110px; height: 110px; border-radius: 50%; object-fit: cover; border: 3px solid #a855f7; margin-bottom: 18px; background: #4c1d95; }
    .profile-name { font-size: 22px; font-weight: 700; margin-bottom: 10px; }
    .wood-medal-container { display: none; flex-direction: column; align-items: center; margin-bottom: 20px; animation: popIn 0.5s ease-out; }
.wood-medal { width: 80px; height: 80px; margin-bottom: 5px; }
    .wood-medal-text { font-size: 12px; color: #fbbf24; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
    @keyframes popIn { 0% { opacity: 0; transform: scale(0.5); } 100% { opacity: 1; transform: scale(1); } }
    .profile-bottom { width: 100%; margin-top: auto; }
    .progress-label { font-size: 13px; color: #c4b5fd; margin-bottom: 8px; display: flex; justify-content: space-between; }
    .progress-bar { height: 8px; background: rgba(255,255,255,0.15); border-radius: 10px; overflow: hidden; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, #c084fc, #a855f7); width: 0%; transition: width 0.3s; }
    .progress-hint { font-size: 12px; color: #9ca3af; margin-top: 10px; text-align: center; }

    /* РЕЙТИНГ */
    .rating-container { flex: 1; overflow-y: auto; padding: 80px 16px 100px; }
    .rating-row { display: flex; align-items: center; padding: 12px 16px; border-radius: 16px; margin-bottom: 8px; background: rgba(255,255,255,0.05); border: 1px solid transparent; }
    .rating-top-1 { background: linear-gradient(90deg, rgba(234, 179, 8, 0.15) 0%, rgba(26, 26, 33, 0.8) 100%); border: 1px solid rgba(234, 179, 8, 0.4); }
    .rating-top-2 { background: linear-gradient(90deg, rgba(156, 163, 175, 0.15) 0%, rgba(26, 26, 33, 0.8) 100%); border: 1px solid rgba(156, 163, 175, 0.4); }
    .rating-top-3 { background: linear-gradient(90deg, rgba(180, 83, 9, 0.15) 0%, rgba(26, 26, 33, 0.8) 100%); border: 1px solid rgba(180, 83, 9, 0.4); }
    .rating-rank { width: 32px; height: 32px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 14px; font-weight: 700; margin-right: 12px; flex-shrink: 0; background: rgba(255,255,255,0.1); color: #9ca3af; }
    .rating-rank-1 { background: #eab308; color: #000; }
    .rating-rank-2 { background: #9ca3af; color: #000; }
    .rating-rank-3 { background: #b45309; color: #fff; }
    .rating-avatar { width: 40px; height: 40px; border-radius: 50%; margin-right: 12px; object-fit: cover; background: #333; flex-shrink: 0; }
    .rating-name { flex: 1; font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .rating-score { background: rgba(255,255,255,0.1); padding: 6px 10px; border-radius: 8px; font-size: 14px; font-weight: 700; color: #d8b4fe; min-width: 70px; text-align: center; }
    .my-rating-box { position: fixed; bottom: 70px; left: 0; right: 0; background: #1a1625; border-top: 1px solid rgba(255,255,255,0.1); padding: 12px 16px; display: flex; align-items: center; z-index: 50; }
    .my-rating-box .rating-rank { background: rgba(255,255,255,0.1); color: #9ca3af; width: 40px; height: 40px; font-size: 13px; }
    .my-rating-box .rating-name { color: #a855f7; display: flex; align-items: center; gap: 8px; }
    .badge-you { background: #8b5cf6; color: white; font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: 700; }

    /* МЕНЮ */
    .bottom-menu { height: 70px; background: #1a1625; display: flex; border-top: 1px solid rgba(255,255,255,0.08); z-index: 100; }
    .menu-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; color: #9ca3af; cursor: pointer; }
    .menu-item.active { color: #e9d5ff; }
    .menu-icon { font-size: 22px; }

    .float-text { position: fixed; font-size: 24px; font-weight: 800; color: #f5d0fe; text-shadow: 0 2px 4px rgba(0,0,0,0.5); pointer-events: none; animation: floatUp 0.8s ease-out forwards; z-index: 100; }
    @keyframes floatUp { 0% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -150%) scale(1.5); } }
  </style>
</head>
<body>

  <div id="error-screen"></div>
 <div class="top-balance" id="openProfile">
    <img class="top-avatar" id="topAvatar" src="" alt="">
    <div class="top-balance-text">
      <div class="top-balance-label">Ваш баланс</div>
      <div class="top-balance-value" id="balance">0.000</div>
    </div>
  </div>

  <div class="screen active" id="screen-main">
    <div class="main-content">
      <div class="potato-wrap" id="potatoBtn">
        <img src="potato.png" draggable="false" alt="🥔" onerror="this.style.display='none'; this.parentNode.innerHTML='<div style=\'font-size:100px\'>🥔</div>';">
      </div>
      <div class="tap-power">Тап: <span id="tapPower">0.001</span> ₽</div>
      <div class="auto-info" id="autoInfo" style="display:none;"></div>
    </div>
  </div>

  <div class="screen" id="screen-upgrades">
    <div class="tabs">
      <button class="tab-btn active" id="tabTap">Ул. тапа</button>
      <button class="tab-btn" id="tabAuto">Ул. автокликера</button>
    </div>
    <div class="list-content" id="upgradesList"></div>
  </div>

  <div class="screen" id="screen-quests">
    <div class="list-content" id="questsList"></div>
  </div>

  <div class="screen" id="screen-rating">
    <div class="rating-container" id="leaderboardList"></div>
    <div class="my-rating-box">
      <div class="rating-rank">999+</div>
      <div class="rating-name">
        <img class="rating-avatar" style="margin-right: 0; width:30px; height:30px;" id="myRatingAvatar" src="" alt="">
        <span class="badge-you">ВЫ</span>
      </div>
      <div class="rating-score" id="myRatingScore">0</div>
    </div>
  </div>

  <div class="screen" id="screen-profile">
    <div class="profile-content">
      <img class="profile-avatar" id="profileAvatar" src="" alt="">
      <div class="profile-name" id="profileName">Игрок</div>
      <div class="wood-medal-container" id="woodMedalBox">
        <svg class="wood-medal" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <path d="M50 10 C 80 10, 95 30, 90 60 C 85 85, 60 95, 40 90 C 15 85, 5 60, 10 35 C 15 15, 30 10, 50 10 Z" fill="#8B5A2B" stroke="#5C3A21" stroke-width="3"/>
          <ellipse cx="35" cy="40" rx="4" ry="2" fill="#5C3A21" transform="rotate(-20 35 40)"/>
          <ellipse cx="65" cy="55" rx="5" ry="3" fill="#5C3A21" transform="rotate(30 65 55)"/>
          <ellipse cx="45" cy="70" rx="3" ry="2" fill="#5C3A21" transform="rotate(10 45 70)"/>
          <ellipse cx="70" cy="30" rx="3" ry="2" fill="#5C3A21" transform="rotate(-40 70 30)"/>
          <path d="M 20 35 C 30 25, 50 20, 70 25" stroke="#A06B3E" stroke-width="3" fill="none" stroke-linecap="round"/>
        </svg>
        <div class="wood-medal-text">Легенда</div>
      </div>

      <div class="profile-bottom">
        <div class="progress-label"><span>Всего тапов</span><span id="totalTapsText">0</span></div>
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <div class="progress-hint">Число тапов, чтобы друзья могли посмотреть</div>
        <button class="btn" style="margin-top: 30px; background: #10b981;" onclick="withdrawMoney()">Вывести средства</button>
        <div id="devBtn" style="margin-top: 20px; font-size: 10px; color: #4b5563; text-align: center; cursor: pointer;">Нажми 5 раз для теста</div>
      </div>
    </div>
  </div>

  <div class="bottom-menu">
    <div class="menu-item active" data-screen="main"><div class="menu-icon">☕</div><div>Главная</div></div>
    <div class="menu-item" data-screen="upgrades"><div class="menu-icon">⚡</div><div>Улучшения</div></div>
    <div class="menu-item" data-screen="rating"><div class="menu-icon">🏆</div><div>Рейтинг</div></div>
    <div class="menu-item" data-screen="quests"><div class="menu-icon">⏳</div><div>Квесты</div></div>
  </div>

  <script>
    // 1. Перехват ошибок
    window.onerror = function(msg, url, line) {
      const err = document.getElementById('error-screen');
      err.style.display = 'block';
      err.innerHTML += <p><b>ОШИБКА:</b> ${msg} <br>Строка: ${line}</p>;
      return false;
    };
 // 2. Telegram
    let tg = null;
    if (window.Telegram && window.Telegram.WebApp) {
      tg = window.Telegram.WebApp;
      tg.ready();
      tg.expand();
    }

    // 3. Данные
    const upgradesData = [
      { name: "Улучшенный тап", desc: "Каждый тап даёт 0.002 ₽", cost: 2.5, value: 0.002 },
      { name: "Сильный тап", desc: "Каждый тап даёт 0.003 ₽", cost: 4, value: 0.003 },
      { name: "Мощный тап", desc: "Каждый тап даёт 0.004 ₽", cost: 8, value: 0.004 },
      { name: "Супер тап", desc: "Каждый тап даёт 0.005 ₽", cost: 16, value: 0.005 },
      { name: "Мега тап", desc: "Каждый тап даёт 0.010 ₽", cost: 50, value: 0.010 }
    ];
    const autoValueData = [
      { level: 1, cost: 50, value: 0.0002 }, { level: 2, cost: 60, value: 0.0003 },
      { level: 3, cost: 70, value: 0.0004 }, { level: 4, cost: 80, value: 0.0005 }
    ];
    const autoSpeedData = [
      { level: 1, cost: 55, interval: 45000 }, { level: 2, cost: 65, interval: 40000 }, { level: 3, cost: 75, interval: 35000 }
    ];
    const questsData = [
      { id: 1, title: "Натапать 1000 раз", need: 1000, reward: 0.5 },
      { id: 2, title: "Натапать 5000 раз", need: 5000, reward: 1 },
      { id: 3, title: "Натапать 10000 раз", need: 10000, reward: 2 },
      { id: 4, title: "Натапать 15000 раз", need: 15000, reward: 5 },
      { id: 5, title: "Натапать 20000 раз", need: 20000, reward: 10 }
    ];
    const leaderboardData = [
      { rank: 1, name: "zz***z0", score: "19.5M", avatar: "https://i.pravatar.cc/150?img=11" },
      { rank: 2, name: "nn***z4", score: "17.1M", avatar: "https://i.pravatar.cc/150?img=12" },
      { rank: 3, name: "Ma***li", score: "14.0M", avatar: "https://i.pravatar.cc/150?img=13" },
      { rank: 4, name: "dr***on", score: "11.2M", avatar: "https://i.pravatar.cc/150?img=14" },
      { rank: 5, name: "Spicy Peb...", score: "10.4M", avatar: "https://i.pravatar.cc/150?img=15" }
    ];

    // 4. Состояние
    let balance = parseFloat(localStorage.getItem('potatoBalance')) || 0;
    let tapValue = parseFloat(localStorage.getItem('tapValue')) || 0.001;
    let maxUpgrade = parseInt(localStorage.getItem('maxUpgrade')) || 0;
    let totalTaps = parseInt(localStorage.getItem('totalTaps')) || 0;
    let claimed = JSON.parse(localStorage.getItem('claimed') || '[]');
    let hasAutoclicker = localStorage.getItem('hasAutoclicker') === 'true';
    let autoValue = parseFloat(localStorage.getItem('autoValue')) || 0.0001;
    let autoInterval = parseInt(localStorage.getItem('autoInterval')) || 50000;
    let autoValueLevel = parseInt(localStorage.getItem('autoValueLevel')) || 0;
    let autoSpeedLevel = parseInt(localStorage.getItem('autoSpeedLevel')) || 0;
    let currentTab = 'tap';
    let autoTimer = null;
    let lastTapTime = 0;

    // 5. DOM
    const balanceEl = document.getElementById('balance');
    const tapPowerEl = document.getElementById('tapPower');
    const potatoBtn = document.getElementById('potatoBtn');
    const upgradesList = document.getElementById('upgradesList');
    const questsList = document.getElementById('questsList');
    const autoInfo = document.getElementById('autoInfo');
    const totalTapsText = document.getElementById('totalTapsText');
    const progressFill = document.getElementById('progressFill');
    const woodMedalBox = document.getElementById('woodMedalBox');

    // 6. Функции
    function save() {
      localStorage.setItem('potatoBalance', balance.toFixed(3));
      localStorage.setItem('tapValue', tapValue.toFixed(3));
      localStorage.setItem('maxUpgrade', maxUpgrade);
      localStorage.setItem('totalTaps', totalTaps);
      localStorage.setItem('claimed', JSON.stringify(claimed));
      localStorage.setItem('hasAutoclicker', hasAutoclicker);
      localStorage.setItem('autoValue', autoValue.toFixed(4));
      localStorage.setItem('autoInterval', autoInterval);
      localStorage.setItem('autoValueLevel', autoValueLevel);
      localStorage.setItem('autoSpeedLevel', autoSpeedLevel);
    }
 function updateUI() {
      balanceEl.innerText = balance.toFixed(3);
      tapPowerEl.innerText = tapValue.toFixed(3);
      totalTapsText.innerText = totalTaps;
      progressFill.style.width = Math.min(100, (totalTaps / 20000) * 100) + '%';
      document.getElementById('myRatingScore').innerText = balance.toFixed(1);
      save();
    }

    function updateAutoInfo() {
      if (hasAutoclicker) {
        autoInfo.style.display = 'block';
        autoInfo.innerText = Автокликер: +${autoValue.toFixed(4)} ₽ каждые ${autoInterval / 1000} сек;
      } else {
        autoInfo.style.display = 'none';
      }
    }

    function startAutoclicker() {
      if (autoTimer) clearInterval(autoTimer);
      if (!hasAutoclicker) return;
      autoTimer = setInterval(() => {
        balance += autoValue;
        updateUI();
      }, autoInterval);
    }

    // === САМАЯ НАДЕЖНАЯ ЛОГИКА ТАПА ===
    function handleTap(e) {
      const now = Date.now();
      if (now - lastTapTime < 50) return; // Защита от двойного клика
      lastTapTime = now;

      if (e.cancelable) e.preventDefault();
      if (tg && tg.HapticFeedback) {
        try { tg.HapticFeedback.impactOccurred('light'); } catch(err) {}
      }

      balance += tapValue;
      totalTaps += 1;
      updateUI();

      const float = document.createElement('div');
      float.className = 'float-text';
      float.innerText = '+' + tapValue.toFixed(3);
      
      let clientX = window.innerWidth / 2;
      let clientY = window.innerHeight / 2;
      if (e.touches && e.touches[0]) {
        clientX = e.touches[0].clientX;
        clientY = e.touches[0].clientY;
      } else if (e.clientX) {
        clientX = e.clientX;
        clientY = e.clientY;
      }

      float.style.left = clientX + 'px';
      float.style.top = clientY + 'px';
      
      document.body.appendChild(float);
      setTimeout(() => { if (float.parentNode) float.parentNode.removeChild(float); }, 800);
    }

    if (potatoBtn) {
      potatoBtn.addEventListener('touchstart', handleTap, { passive: false });
      potatoBtn.addEventListener('mousedown', handleTap);
    }

    // === РЕНДЕР ===
    function renderUpgrades() {
      upgradesList.innerHTML = '';
      if (currentTab === 'tap') {
        upgradesData.forEach((upg, i) => {
          const level = i + 1;
          const isBought = level <= maxUpgrade;
          const isNext = level === maxUpgrade + 1;
          let btnText = isBought ? 'Куплено' : (isNext ? Купить за ${upg.cost} ₽ : 'Сначала купи предыдущее');
          
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = <div class="card-title">${upg.name}</div><div class="card-desc">${upg.desc}</div>;
          
          const btn = document.createElement('button');
          btn.className = 'btn';
          btn.innerText = btnText;
          if (!isNext) btn.disabled = true;

          if (isNext) {
            btn.onclick = () => {
              if (balance >= upg.cost) {
                balance -= upg.cost;
                tapValue = upg.value;
                maxUpgrade = level;
                updateUI();
                renderUpgrades();
                if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
              } else alert('Недостаточно средств!');
            };
          }
          card.appendChild(btn);
          upgradesList.appendChild(card);
        });
      } else {
        if (!hasAutoclicker) {
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = <div class="card-title">Купить автокликер</div><div class="card-desc">Даёт +0.0001 ₽ каждые 50 секунд</div>;
          const btn = document.createElement('button');
          btn.className = 'btn';
 btn.innerText = 'Купить за 100 ₽';
          btn.onclick = () => {
            if (balance >= 100) {
              balance -= 100;
              hasAutoclicker = true;
              updateUI(); updateAutoInfo(); startAutoclicker(); renderUpgrades();
            } else alert('Недостаточно средств!');
          };
          card.appendChild(btn);
          upgradesList.appendChild(card);
        } else {
          const t1 = document.createElement('div'); t1.className = 'section-title'; t1.innerText = 'Сила автокликера'; upgradesList.appendChild(t1);
          autoValueData.forEach(av => {
            const isB = autoValueLevel >= av.level;
            const isN = autoValueLevel + 1 === av.level;
            const card = document.createElement('div'); card.className = 'card';
            card.innerHTML = <div class="card-title">Сила Lv.${av.level}</div><div class="card-desc">Даёт ${av.value} ₽</div>;
            const btn = document.createElement('button'); btn.className = 'btn';
            btn.innerText = isB ? 'Куплено' : (isN ? Купить за ${av.cost} ₽ : 'Сначала купи предыдущее');
            if (!isN) btn.disabled = true;
            if (isN) {
              btn.onclick = () => {
                if (balance >= av.cost) {
                  balance -= av.cost; autoValue = av.value; autoValueLevel = av.level;
                  updateUI(); updateAutoInfo(); startAutoclicker(); renderUpgrades();
                } else alert('Мало денег!');
              };
            }
            card.appendChild(btn); upgradesList.appendChild(card);
          });
          
          const t2 = document.createElement('div'); t2.className = 'section-title'; t2.innerText = 'Скорость автокликера'; upgradesList.appendChild(t2);
          autoSpeedData.forEach(as => {
            const isB = autoSpeedLevel >= as.level;
            const isN = autoSpeedLevel + 1 === as.level;
            const card = document.createElement('div'); card.className = 'card';
            card.innerHTML = <div class="card-title">Скорость Lv.${as.level}</div><div class="card-desc">Интервал: ${as.interval / 1000} сек</div>;
            const btn = document.createElement('button'); btn.className = 'btn';
            btn.innerText = isB ? 'Куплено' : (isN ? Купить за ${as.cost} ₽ : 'Сначала купи предыдущее');
            if (!isN) btn.disabled = true;
            if (isN) {
              btn.onclick = () => {
                if (balance >= as.cost) {
                  balance -= as.cost; autoInterval = as.interval; autoSpeedLevel = as.level;
                  updateUI(); updateAutoInfo(); startAutoclicker(); renderUpgrades();
                } else alert('Мало денег!');
              };
            }
            card.appendChild(btn); upgradesList.appendChild(card);
          });
        }
      }
    }

    function renderQuests() {
      questsList.innerHTML = '';
      questsData.forEach(q => {
        const isClaimed = claimed.includes(q.id);
        const canClaim = !isClaimed && totalTaps >= q.need;
        
        const card = document.createElement('div'); card.className = 'card';
        card.innerHTML = 
          <div class="card-title">${q.title}</div>
          <div class="card-desc">Сделай ${q.need} тапов</div>
          <div style="margin-bottom: 10px; color: #e9d5ff;">Прогресс: ${Math.min(totalTaps, q.need)} / ${q.need}</div>
        ;
        
        const btn = document.createElement('button'); btn.className = 'btn';
        if (isClaimed) { btn.innerText = 'Получено'; btn.disabled = true; }
        else if (canClaim) {
          btn.innerText = Забрать (+${q.reward} ₽);
          btn.onclick = () => {
            balance += q.reward; claimed.push(q.id);
            updateUI(); renderQuests();
            if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
          };
        } else { btn.innerText = 'Ещё не выполнено'; btn.disabled = true; }
        card.appendChild(btn); questsList.appendChild(card);
      });
    }
 function renderRating() {
      const container = document.getElementById('leaderboardList');
      container.innerHTML = '';
      leaderboardData.forEach(p => {
        const row = document.createElement('div');
        row.className = 'rating-row';
        if (p.rank === 1) row.classList.add('rating-top-1');
        if (p.rank === 2) row.classList.add('rating-top-2');
        if (p.rank === 3) row.classList.add('rating-top-3');
        
        let rankClass = 'rating-rank';
        if (p.rank === 1) rankClass += ' rating-rank-1';
        if (p.rank === 2) rankClass += ' rating-rank-2';
        if (p.rank === 3) rankClass += ' rating-rank-3';

        row.innerHTML = 
          <div class="${rankClass}">${p.rank}</div>
          <img class="rating-avatar" src="${p.avatar}" alt="">
          <div class="rating-name">${p.name}</div>
          <div class="rating-score">${p.score}</div>
        ;
        container.appendChild(row);
      });
    }

    function loadUser() {
      let photo = '', name = 'Игрок';
      try {
        if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
          const u = tg.initDataUnsafe.user;
          if (u.photo_url) photo = u.photo_url;
          if (u.username) name = '@' + u.username;
          else if (u.first_name) name = u.first_name;
        }
      } catch(e) {}

      if (!photo) photo = 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="50" fill="%234c1d95"/><text x="50" y="62" font-size="40" text-anchor="middle" fill="white">🥔</text></svg>';
      
      document.getElementById('topAvatar').src = photo;
      document.getElementById('profileAvatar').src = photo;
      document.getElementById('myRatingAvatar').src = photo;
      document.getElementById('profileName').innerText = name;

      if (claimed.includes(5)) {
        woodMedalBox.style.display = 'flex';
      } else {
        woodMedalBox.style.display = 'none';
      }
    }

    function showScreen(name) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      const target = document.getElementById('screen-' + name);
      if (target) target.classList.add('active');

      document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
      const activeMenu = document.querySelector(.menu-item[data-screen="${name}"]);
      if (activeMenu) activeMenu.classList.add('active');

      if (name === 'upgrades') renderUpgrades();
      if (name === 'quests') renderQuests();
      if (name === 'profile') loadUser();
      if (name === 'rating') renderRating();
    }

    // === СЛУШАТЕЛИ СОБЫТИЙ ===
    document.getElementById('openProfile').onclick = () => showScreen('profile');
    
    document.querySelectorAll('.menu-item').forEach(item => {
      item.onclick = function() { showScreen(this.getAttribute('data-screen')); };
    });

    document.getElementById('tabTap').onclick = function() {
      currentTab = 'tap';
      this.classList.add('active');
      document.getElementById('tabAuto').classList.remove('active');
      renderUpgrades();
    };

    document.getElementById('tabAuto').onclick = function() {
      currentTab = 'auto';
      this.classList.add('active');
      document.getElementById('tabTap').classList.remove('active');
      renderUpgrades();
    };

    // Вывод и тест
    window.withdrawMoney = () => {
      if (balance < 10) return alert('Минимум 10 ₽');
      alert(Вывод ${balance.toFixed(2)} ₽ (тест));
      balance = 0;
      updateUI();
    };

    let devClickCount = 0;
    document.getElementById('devBtn').onclick = () => {
      devClickCount++;
      if (devClickCount >= 5) {
        balance += 1000;
        totalTaps += 20000;
        updateUI();
        alert('+1000 ₽ и +20000 тапов для тестов!');
        devClickCount = 0;
      }
    };
 // === ЗАПУСК ===
    try {
      loadUser();
      updateUI();
      updateAutoInfo();
      if (hasAutoclicker) startAutoclicker();
    } catch (e) {
      console.error("Ошибка при запуске:", e);
    }
  </script>
</body>
</html>
