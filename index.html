<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Картоха</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
    body {
      background: linear-gradient(180deg, #2e1065, #1e1b4b);
      color: white;
      font-family: 'Press Start 2P', 'Courier New', monospace;
      font-size: 10px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      text-shadow: 2px 2px 0px rgba(0,0,0,0.8);
      transition: background 0.8s;
    }
    body.theme-halloween { background: linear-gradient(180deg, #1a0b2e, #000000); }
    body.theme-newyear { background: linear-gradient(180deg, #0f172a, #1e293b); }
    body.theme-valentine { background: linear-gradient(180deg, #4c0519, #881337); }

    #eventBanner {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 36px;
      background: #7c3aed; color: white; z-index: 999;
      text-align: center; font-size: 9px; line-height: 36px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.5); cursor: pointer;
    }

    .top-balance { 
      position: absolute; top: 14px; right: 14px; display: flex; align-items: center; gap: 10px; 
      background: rgba(0,0,0,0.45); padding: 4px 4px 4px 10px; z-index: 60; cursor: pointer; 
      border: 3px solid; border-color: #c084fc #4c1d95 #4c1d95 #c084fc;
    }
    .top-avatar { width: 30px; height: 30px; border: 2px solid #4c1d95; object-fit: cover; background: #4c1d95; image-rendering: pixelated; order: 2; }
    .top-balance-text { display: flex; flex-direction: column; align-items: flex-end; order: 1; }
    .top-balance-label { font-size: 8px; color: #c4b5fd; margin-bottom: 4px; }
    .top-balance-value { font-size: 12px; font-weight: bold; color: #fff; }
    .top-balance-value.negative { color: #ef4444; } 

    .btn-top-back {
      position: absolute; top: 14px; left: 14px; z-index: 70;
      background: rgba(76, 29, 149, 0.7);
      border: 3px solid; border-color: #a855f7 #4c1d95 #4c1d95 #a855f7; 
      color: white; padding: 8px 12px; font-family: inherit; font-size: 12px; cursor: pointer;
    }
    .btn-top-back:active { border-color: #4c1d95 #a855f7 #a855f7 #4c1d95; }

    .btn-info {
      position: fixed; bottom: 90px; right: 20px; z-index: 80;
      background: rgba(59, 130, 246, 0.8);
      border: 3px solid; border-color: #93c5fd #1e40af #1e40af #93c5fd; 
      color: white; width: 40px; height: 40px; border-radius: 50%;
      font-family: inherit; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    }

    .main-btns-container {
      position: absolute; top: 60px; left: 14px; display: flex; flex-direction: column; gap: 10px; z-index: 60;
    }
    .shop-btn-main, .casino-btn-main {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      padding: 6px 10px; cursor: pointer; border: 3px solid; 
    }
    .shop-btn-main { background: rgba(168, 85, 247, 0.15); border-color: #c084fc #4c1d95 #4c1d95 #c084fc; }
    .casino-btn-main { background: rgba(234, 179, 8, 0.15); border-color: #fde047 #a16207 #a16207 #fde047; }
    .shop-btn-main span, .casino-btn-main span { font-size: 9px; color: #fff; text-transform: uppercase; }

    .screen { flex: 1; display: none; flex-direction: column; overflow-y: auto; position: relative; }
    .screen.active { display: flex; }

    .main-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding-top: 70px; }
    
    .potato-wrap { width: 220px; height: 220px; cursor: pointer; display: flex; align-items: center; justify-content: center; position: relative; z-index: 10; }
    .potato-emoji { font-size: 120px; transition: transform 0.1s; pointer-events: none; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.5)); }
    .potato-wrap:active .potato-emoji { animation: shake 0.1s; }
    @keyframes shake { 0%{transform:translate(1px,1px) rotate(0)} 25%{transform:translate(-1px,-2px) rotate(-1deg)} 50%{transform:translate(-3px,0) rotate(1deg)} 75%{transform:translate(3px,2px) rotate(0)} 100%{transform:translate(1px,-2px) rotate(-1deg)} }

    .tap-power { margin-top: 16px; font-size: 11px; color: #c4b5fd; }
    .tap-boost { font-size: 10px; color: #fde047; margin-left: 5px; }
    .auto-info { margin-top: 10px; font-size: 9px; color: #10b981; }

    .tabs { display: flex; gap: 10px; padding: 80px 16px 12px; }
    .tab-btn { 
      flex: 1; padding: 12px 6px; border: none; font-size: 10px; 
      background: rgba(76, 29, 149, 0.7); color: #c4b5fd; cursor: pointer; 
      border: 4px solid; border-color: #a855f7 #4c1d95 #4c1d95 #a855f7; 
      text-shadow: 2px 2px 0 #000; font-family: inherit; text-transform: uppercase;
    }
    .tab-btn.active { background: #8b5cf6; color: white; border-color: #d8b4fe #5b21b6 #5b21b6 #d8b4fe; }

    .shop-tabs { display: flex; gap: 8px; margin-bottom: 20px; padding: 80px 16px 0; flex-wrap: wrap; }
    .shop-tab-btn { 
      flex: 1; min-width: 70px; padding: 10px 6px; border: none; font-size: 9px; 
      background: rgba(76, 29, 149, 0.7); color: #c4b5fd; cursor: pointer; 
      border: 3px solid; border-color: #a855f7 #4c1d95 #4c1d95 #a855f7; 
      font-family: inherit;
    }
    .shop-tab-btn.active { background: #8b5cf6; color: white; border-color: #d8b4fe #5b21b6 #5b21b6 #d8b4fe; }
    .shop-tab-btn.black { background: #1e1b4b; border-color: #a855f7 #000 #000 #a855f7; }

    .list-content { padding: 0 16px 30px; }
    #screen-achievements .list-content { padding-top: 75px; } 
    #screen-quests .list-content { padding-top: 20px; }
    #screen-upgrades .list-content { padding-top: 0; }
    
    .card { 
      background: rgba(255,255,255,0.09); padding: 12px; margin-bottom: 12px; display: flex; align-items: center; gap: 12px; 
      border: 3px solid; border-color: #a855f7 #4c1d95 #4c1d95 #a855f7;
    }
    .card-content { flex: 1; min-width: 0; }
    .card-title { font-size: 11px; margin-bottom: 6px; color: #fff; }
    .card-desc { font-size: 9px; color: #c4b5fd; margin-bottom: 6px; line-height: 1.4; }
    
    .btn { 
      background: #8b5cf6; border: none; color: white; padding: 10px; font-size: 9px; cursor: pointer; margin-bottom: 10px; 
      border: 3px solid; border-color: #c084fc #4c1d95 #4c1d95 #c084fc; text-shadow: 2px 2px 0 rgba(0,0,0,0.5); font-family: inherit;
    }
    .btn:active { border-color: #4c1d95 #c084fc #c084fc #4c1d95; }
    .btn:disabled { background: #4b5563; color: #9ca3af; border-color: #6b7280 #1f2937 #1f2937 #6b7280; }
    .btn-green { background: #10b981; border-color: #6ee7b7 #065f46 #065f46 #6ee7b7; }
    .btn-blue { background: #3b82f6; border-color: #93c5fd #1e40af #1e40af #93c5fd; }
    .btn-grey { background: rgba(255,255,255,0.1); border-color: #c084fc #4c1d95 #4c1d95 #c084fc; }
    .btn-gold { background: #eab308; border-color: #fde047 #854d0e #854d0e #fde047; color: #000; text-shadow: none; }
    .btn-dark { background: #1e1b4b; border-color: #a855f7 #4c1d95 #4c1d95 #a855f7; }

    .shop-card { flex-direction: column; text-align: center; padding: 14px; gap: 8px; }
    .shop-preview { font-size: 48px; height: 60px; display: flex; align-items: center; justify-content: center; }
    .shop-card .btn { width: 100%; margin-bottom: 0; font-size: 8px; }

    .profile-content { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 70px 20px 30px; }
    .profile-avatar { width: 100px; height: 100px; border: 3px solid #a855f7; object-fit: cover; margin-bottom: 12px; background: #4c1d95; }
    .profile-name { font-size: 12px; margin-bottom: 6px; }
    .profile-badges { font-size: 16px; margin-bottom: 10px; display: flex; gap: 6px; }
    .profile-rank { font-size: 9px; color: #fde047; margin-bottom: 18px; }
    .profile-bottom { width: 100%; margin-top: auto; }
    .progress-label { font-size: 9px; color: #c4b5fd; margin-bottom: 8px; display: flex; justify-content: space-between; }
    .progress-bar { height: 16px; background: rgba(0,0,0,0.5); border: 2px solid #a855f7; overflow: hidden; }
    .progress-fill { height: 100%; background: #10b981; width: 0%; transition: width 0.3s; }

    .bottom-menu { height: 70px; background: #1a1625; display: flex; border-top: 3px solid #c084fc; z-index: 100; }
    .menu-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; font-size: 8px; color: #9ca3af; cursor: pointer; }
    .menu-item.active { color: #e9d5ff; }
    .menu-icon { font-size: 22px; }

    .float-text { position: fixed; font-size: 14px; color: #f5d0fe; text-shadow: 2px 2px 0 #000; pointer-events: none; z-index: 100; animation: floatUp 0.8s ease-out forwards; }
    @keyframes floatUp { 0% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -150%) scale(1.4); } }

    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; }
    .modal-content { 
      background: #2e1065; padding: 20px; width: 90%; max-width: 340px; 
      border: 3px solid; border-color: #a855f7 #4c1d95 #4c1d95 #a855f7; max-height: 80vh; overflow-y: auto; 
    }
    .modal-content h3 { margin-bottom: 15px; font-size: 12px; color: #fde047; text-align: center; }
    .modal-btn { 
      background: #8b5cf6; border: 3px solid; border-color: #c084fc #4c1d95 #4c1d95 #c084fc; color: white; padding: 10px; width: 100%; margin-top: 10px; font-size: 9px; cursor: pointer; font-family: inherit; text-align: center;
    }

    .section-title { font-size: 10px; color: #a78bfa; margin: 14px 0 10px; }
  </style>
</head>
<body>

  <div id="eventBanner"><span id="eventBannerText"></span></div>

  <!-- Модалка теста событий -->
  <div class="modal-overlay" id="testEventModal">
    <div class="modal-content" style="text-align:center;">
      <h3>🧪 Тест событий</h3>
      <button class="modal-btn" style="background:#ea580c;" onclick="forceEvent('halloween')">🎃 Хэллоуин</button>
      <button class="modal-btn" style="background:#065f46;" onclick="forceEvent('newYear')">🎄 Новый год</button>
      <button class="modal-btn" style="background:#be123c;" onclick="forceEvent('valentine')">❤️ Валентин</button>
      <button class="modal-btn" style="background:#1e1b4b;" onclick="forceEvent('blackMarket')">🌑 Чёрный рынок</button>
      <button class="modal-btn" style="background:#4b5563;" onclick="forceEvent('none')">❌ Выключить всё</button>
      <button class="modal-btn" onclick="closeTestEventMenu()">Закрыть</button>
    </div>
  </div>

  <div class="top-balance" id="openProfile">
    <img class="top-avatar" id="topAvatar" src="" alt="">
    <div class="top-balance-text">
      <div class="top-balance-label">Баланс</div>
      <div class="top-balance-value" id="balance">0.000</div>
    </div>
  </div>

  <!-- ГЛАВНАЯ -->
  <div class="screen active" id="screen-main">
    <div class="main-btns-container">
      <div class="shop-btn-main" onclick="showScreen('shop')">🛒 <span>Магазин</span></div>
      <div class="casino-btn-main" onclick="showScreen('casino')">🎮 <span>Казино</span></div>
    </div>
    <div class="main-content">
      <div class="potato-wrap" id="potatoBtn">
        <div id="potatoDisplay" class="potato-emoji">🥔</div>
      </div>
      <div class="tap-power">Тап: <span id="tapPower">0.001</span> ₽ <span id="tapBoostDisplay" class="tap-boost"></span></div>
      <div class="auto-info" id="autoInfo" style="display:none;"></div>
    </div>
  </div>

  <!-- МАГАЗИН -->
  <div class="screen" id="screen-shop">
    <button class="btn-top-back" onclick="showScreen('main')">✖</button>
    <div class="shop-tabs">
      <button class="shop-tab-btn active" onclick="switchShopTab('skins')">Скины</button>
      <button class="shop-tab-btn" onclick="switchShopTab('gifts')">Подарки</button>
      <button class="shop-tab-btn black" id="tabBlackMarket" style="display:none;" onclick="switchShopTab('black')">🌑 Рынок</button>
    </div>
    <div id="shopContentSkins" style="display:block;">
      <div class="list-content" id="shopList" style="display:grid; grid-template-columns:1fr 1fr; gap:12px;"></div>
    </div>
    <div id="shopContentBlack" style="display:none;">
      <div class="list-content" id="blackMarketList" style="display:grid; grid-template-columns:1fr 1fr; gap:12px;"></div>
    </div>
    <div id="shopContentGifts" style="display:none;">
      <div style="padding:20px; text-align:center; color:#c4b5fd;">Ежедневный подарок<br>(скоро)</div>
    </div>
  </div>

  <!-- УЛУЧШЕНИЯ -->
  <div class="screen" id="screen-upgrades">
    <div class="tabs">
      <button class="tab-btn active" id="tabTap">Ул. тапа</button>
      <button class="tab-btn" id="tabAuto">Ул. авто</button>
    </div>
    <div class="list-content" id="upgradesList"></div>
  </div>

  <!-- КВЕСТЫ -->
  <div class="screen" id="screen-quests">
    <div class="list-content" id="questsList"></div>
  </div>

  <!-- РЕЙТИНГ -->
  <div class="screen" id="screen-rating">
    <div style="padding:80px 20px; text-align:center; color:#c4b5fd;">Рейтинг пока пуст</div>
  </div>

  <!-- ПРОФИЛЬ -->
  <div class="screen" id="screen-profile">
    <div class="profile-content">
      <img class="profile-avatar" id="profileAvatar" src="" alt="">
      <div class="profile-name" id="profileName">Игрок</div>
      <div class="profile-badges" id="profileBadges"></div>
      <div class="profile-rank" id="profileRank"></div>
      <div class="profile-bottom">
        <button class="btn btn-grey" onclick="showScreen('settings')">⚙️ Настройки</button>
        <button class="btn btn-dark" onclick="openTestEventMenu()">🧪 Тест событий</button>
        <button class="btn btn-green" onclick="withdrawMoney()">Вывести средства</button>
        <div class="progress-label" style="margin-top:20px;"><span>Всего тапов</span><span id="totalTapsText">0</span></div>
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <div id="devBtn" style="margin-top:20px; font-size:8px; color:#6b7280; text-align:center; cursor:pointer;">Нажми 5 раз для теста</div>
      </div>
    </div>
  </div>

  <!-- НАСТРОЙКИ -->
  <div class="screen" id="screen-settings">
    <button class="btn-top-back" onclick="showScreen('profile')">◀</button>
    <div style="padding:80px 20px; text-align:center;">
      <div style="font-size:14px; margin-bottom:20px;">Настройки</div>
      <button class="btn" style="width:100%;" onclick="openTestEventMenu()">🧪 Тест событий</button>
      <button class="btn btn-grey" style="width:100%;" onclick="alert('Поддержка: @negaduushchiyXD')">📢 Поддержка</button>
    </div>
  </div>

  <!-- КАЗИНО (упрощённо) -->
  <div class="screen" id="screen-casino">
    <button class="btn-top-back" onclick="showScreen('main')">✖</button>
    <div style="padding:80px 20px; text-align:center; color:#c4b5fd;">
      <div style="font-size:14px; color:#fde047; margin-bottom:20px;">🎰 КАЗИНО</div>
      <div style="margin-bottom:15px;">Ящик картошки, Грузовик и Поле картошки<br>пока в разработке</div>
      <button class="btn btn-gold" onclick="alert('Скоро будет!')">Скоро</button>
    </div>
  </div>

  <div class="bottom-menu">
    <div class="menu-item active" data-screen="main"><div class="menu-icon">☕</div><div>Главная</div></div>
    <div class="menu-item" data-screen="upgrades"><div class="menu-icon">⚡</div><div>Улучшения</div></div>
    <div class="menu-item" data-screen="rating"><div class="menu-icon">🏆</div><div>Рейтинг</div></div>
    <div class="menu-item" data-screen="quests"><div class="menu-icon">⏳</div><div>Квесты</div></div>
  </div>

  <script>
    // ===== СИСТЕМА СОБЫТИЙ =====
    var activeEvents = {
      blackMarket: false,
      halloween: false,
      newYear: false,
      valentine: false
    };

    var lastBlackMarket = parseInt(localStorage.getItem('lastBlackMarket')) || 0;
    var blackMarketEnd = parseInt(localStorage.getItem('blackMarketEnd')) || 0;
    var eventHistory = JSON.parse(localStorage.getItem('eventHistory') || '[]');
    var currentBlackMarketItems = JSON.parse(localStorage.getItem('currentBlackMarketItems') || '[]');

    var blackMarketItemsData = [
      { id: 'dark', name: 'Тёмная картошка', basePrice: 250000, emoji: '🌑' },
      { id: 'ghost', name: 'Призрак', basePrice: 180000, emoji: '👻' },
      { id: 'amulet', name: 'Амулет Муаи', basePrice: 420000, emoji: '🗿' },
      { id: 'shadow', name: 'Скин Тень', basePrice: 150000, emoji: '👤' }
    ];

    function checkEvents() {
      var now = Date.now();
      var d = new Date();
      var month = d.getMonth() + 1;
      var day = d.getDate();

      activeEvents.halloween = (month === 10 && day >= 25) || (month === 11 && day <= 5);
      activeEvents.newYear = (month === 12 && day >= 20) || (month === 1 && day <= 10);
      activeEvents.valentine = (month === 2 && day >= 7 && day <= 15);

      if (now < blackMarketEnd) {
        activeEvents.blackMarket = true;
      } else {
        if (now - lastBlackMarket > 6 * 24 * 60 * 60 * 1000) {
          if (Math.random() < 0.7) {
            lastBlackMarket = now;
            blackMarketEnd = now + 48 * 60 * 60 * 1000;
            localStorage.setItem('lastBlackMarket', lastBlackMarket);
            localStorage.setItem('blackMarketEnd', blackMarketEnd);
            activeEvents.blackMarket = true;
            generateBlackMarket();
          } else {
            activeEvents.blackMarket = false;
          }
        } else {
          activeEvents.blackMarket = false;
        }
      }

      updateEventBanner();
      updateBlackMarketTab();
      applyTheme();
    }

    function generateBlackMarket() {
      currentBlackMarketItems = [];
      var shuffled = blackMarketItemsData.slice().sort(function(){ return 0.5 - Math.random(); });
      for (var i = 0; i < 3; i++) {
        var item = JSON.parse(JSON.stringify(shuffled[i]));
        item.price = Math.floor(item.basePrice * (0.5 + Math.random()));
        currentBlackMarketItems.push(item);
      }
      localStorage.setItem('currentBlackMarketItems', JSON.stringify(currentBlackMarketItems));
    }

    function updateEventBanner() {
      var banner = document.getElementById('eventBanner');
      var text = document.getElementById('eventBannerText');
      if (!banner || !text) return;

      if (activeEvents.blackMarket) {
        var hours = Math.max(1, Math.ceil((blackMarketEnd - Date.now()) / 3600000));
        text.innerText = '🌑 Чёрный рынок! Осталось ~' + hours + ' ч';
        banner.style.display = 'block';
        banner.style.background = 'linear-gradient(90deg,#1e1b4b,#4c1d95)';
      } else if (activeEvents.halloween) {
        text.innerText = '🎃 Хэллоуин активен!';
        banner.style.display = 'block';
        banner.style.background = 'linear-gradient(90deg,#ea580c,#9a3412)';
      } else if (activeEvents.newYear) {
        text.innerText = '🎄 Новогоднее событие!';
        banner.style.display = 'block';
        banner.style.background = 'linear-gradient(90deg,#065f46,#047857)';
      } else if (activeEvents.valentine) {
        text.innerText = '❤️ День Валентина!';
        banner.style.display = 'block';
        banner.style.background = 'linear-gradient(90deg,#be123c,#881337)';
      } else {
        banner.style.display = 'none';
      }
    }

    function updateBlackMarketTab() {
      var tab = document.getElementById('tabBlackMarket');
      if (tab) tab.style.display = activeEvents.blackMarket ? 'block' : 'none';
    }

    function applyTheme() {
      document.body.className = '';
      if (activeEvents.halloween) document.body.classList.add('theme-halloween');
      else if (activeEvents.newYear) document.body.classList.add('theme-newyear');
      else if (activeEvents.valentine) document.body.classList.add('theme-valentine');
    }

    // ===== ТЕСТОВЫЕ ФУНКЦИИ =====
    window.forceEvent = function(name) {
      activeEvents = { blackMarket:false, halloween:false, newYear:false, valentine:false };
      if (name === 'halloween') activeEvents.halloween = true;
      if (name === 'newYear') activeEvents.newYear = true;
      if (name === 'valentine') activeEvents.valentine = true;
      if (name === 'blackMarket') {
        activeEvents.blackMarket = true;
        blackMarketEnd = Date.now() + 24*60*60*1000;
        generateBlackMarket();
      }
      updateEventBanner();
      updateBlackMarketTab();
      applyTheme();
      renderBlackMarket();
      closeTestEventMenu();
      alert(name === 'none' ? 'Все события выключены' : 'Событие включено!');
    };

    window.openTestEventMenu = function() {
      document.getElementById('testEventModal').style.display = 'flex';
    };
    window.closeTestEventMenu = function() {
      document.getElementById('testEventModal').style.display = 'none';
    };

    // ===== ОСНОВНЫЕ ПЕРЕМЕННЫЕ =====
    var balance = parseFloat(localStorage.getItem('potatoBalance')) || 0;
    var tapValue = parseFloat(localStorage.getItem('tapValue')) || 0.001;
    var maxUpgrade = parseInt(localStorage.getItem('maxUpgrade')) || 0;
    var totalTaps = parseInt(localStorage.getItem('totalTaps')) || 0;
    var hasAutoclicker = localStorage.getItem('hasAutoclicker') === 'true';
    var autoValue = parseFloat(localStorage.getItem('autoValue')) || 0.0001;
    var autoInterval = parseInt(localStorage.getItem('autoInterval')) || 50000;
    var autoValueLevel = parseInt(localStorage.getItem('autoValueLevel')) || 0;
    var autoSpeedLevel = parseInt(localStorage.getItem('autoSpeedLevel')) || 0;
    var claimed = JSON.parse(localStorage.getItem('claimed') || '[]');
    var ownedSkins = JSON.parse(localStorage.getItem('ownedSkins') || '[0]');
    var equippedSkin = parseInt(localStorage.getItem('equippedSkin')) || 0;
    var currentTab = 'tap';
    var autoTimer = null;
    var lastTapTime = 0;
    var currentMultiplier = 1.05;

    var upgradesData = [
      {name:'Ул. тап', cost:2.5, value:0.002}, {name:'Сильный', cost:4, value:0.003},
      {name:'Мощный', cost:8, value:0.004}, {name:'Супер', cost:16, value:0.005},
      {name:'Мега', cost:50, value:0.01}, {name:'Гипер', cost:100, value:0.02},
      {name:'Ультра', cost:150, value:0.03}, {name:'Турбо', cost:200, value:0.04},
      {name:'Космо', cost:250, value:0.05}, {name:'Божеств.', cost:500, value:0.1}
    ];

    var autoValueData = [
      {level:1, cost:50, value:0.0002}, {level:2, cost:60, value:0.0003},
      {level:3, cost:70, value:0.0004}, {level:4, cost:80, value:0.0005},
      {level:5, cost:160, value:0.001}
    ];

    var autoSpeedData = [
      {level:1, cost:55, interval:45000}, {level:2, cost:65, interval:40000},
      {level:3, cost:75, interval:35000}
    ];

    var questsData = [
      {id:1, need:1000, reward:0.5}, {id:2, need:5000, reward:1},
      {id:3, need:10000, reward:2}, {id:4, need:15000, reward:5},
      {id:5, need:20000, reward:10}
    ];

    var skinsData = [
      {id:0, name:'Обычная', price:0, emoji:'🥔'},
      {id:1, name:'Золотая', price:100000, emoji:'🥇'},
      {id:2, name:'Призрачная', price:50000, emoji:'👻'}
    ];

    // ===== ВСПОМОГАТЕЛЬНЫЕ =====
    function getEl(id) { return document.getElementById(id); }
    function formatMoney(n, d) {
      d = d === undefined ? 3 : d;
      if (isNaN(n)) return (0).toFixed(d);
      var p = Number(n).toFixed(d).split('.');
      p[0] = p[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.');
      return p.join('.');
    }
    function save() {
      localStorage.setItem('potatoBalance', balance.toFixed(3));
      localStorage.setItem('tapValue', tapValue.toFixed(3));
      localStorage.setItem('maxUpgrade', maxUpgrade);
      localStorage.setItem('totalTaps', totalTaps);
      localStorage.setItem('hasAutoclicker', hasAutoclicker);
      localStorage.setItem('autoValue', autoValue.toFixed(4));
      localStorage.setItem('autoInterval', autoInterval);
      localStorage.setItem('autoValueLevel', autoValueLevel);
      localStorage.setItem('autoSpeedLevel', autoSpeedLevel);
      localStorage.setItem('claimed', JSON.stringify(claimed));
      localStorage.setItem('ownedSkins', JSON.stringify(ownedSkins));
      localStorage.setItem('equippedSkin', equippedSkin);
    }

    function updateUI() {
      var balEl = getEl('balance');
      if (balEl) {
        balEl.innerText = formatMoney(balance, tapValue < 1 ? 3 : 0);
        balEl.classList.toggle('negative', balance < 0);
      }
      var tp = getEl('tapPower');
      if (tp) tp.innerText = formatMoney(tapValue * currentMultiplier);
      var tt = getEl('totalTapsText');
      if (tt) tt.innerText = formatMoney(totalTaps, 0);
      var pf = getEl('progressFill');
      if (pf) pf.style.width = Math.min(100, totalTaps / 50000 * 100) + '%';
      updateAutoInfo();
      save();
    }

    function updateAutoInfo() {
      var el = getEl('autoInfo');
      if (!el) return;
      if (hasAutoclicker) {
        el.style.display = 'block';
        el.innerText = 'Авто: +' + autoValue.toFixed(4) + ' ₽ / ' + (autoInterval/1000) + ' сек';
      } else {
        el.style.display = 'none';
      }
    }

    function startAutoclicker() {
      if (autoTimer) clearInterval(autoTimer);
      if (!hasAutoclicker) return;
      autoTimer = setInterval(function() {
        balance += autoValue;
        updateUI();
      }, autoInterval);
    }

    // ===== ТАП =====
    function handleTap(e) {
      var now = Date.now();
      if (now - lastTapTime < 40) return;
      lastTapTime = now;
      if (e.cancelable) e.preventDefault();

      var val = tapValue * currentMultiplier;
      balance += val;
      totalTaps += 1;
      updateUI();

      var float = document.createElement('div');
      float.className = 'float-text';
      float.innerText = '+' + formatMoney(val);
      var x = window.innerWidth / 2, y = window.innerHeight / 2;
      if (e.touches && e.touches[0]) { x = e.touches[0].clientX; y = e.touches[0].clientY; }
      else if (e.clientX) { x = e.clientX; y = e.clientY; }
      float.style.left = x + 'px';
      float.style.top = y + 'px';
      document.body.appendChild(float);
      setTimeout(function(){ if(float.parentNode) float.parentNode.removeChild(float); }, 800);

      if (window.Telegram && Telegram.WebApp && Telegram.WebApp.HapticFeedback) {
        try { Telegram.WebApp.HapticFeedback.impactOccurred('light'); } catch(e){}
      }
    }

    // ===== РЕНДЕР =====
    function renderUpgrades() {
      var list = getEl('upgradesList');
      if (!list) return;
      list.innerHTML = '';

      if (currentTab === 'tap') {
        for (var i = 0; i < upgradesData.length; i++) {
          var u = upgradesData[i];
          var lvl = i + 1;
          var bought = lvl <= maxUpgrade;
          var next = lvl === maxUpgrade + 1;
          var card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = '<div class="card-content"><div class="card-title">' + u.name + '</div><div class="card-desc">Тап даёт ' + formatMoney(u.value) + ' ₽</div></div>';
          var btn = document.createElement('button');
          btn.className = 'btn';
          btn.style.cssText = 'width:auto;margin:0;padding:8px 10px;font-size:9px;';
          if (bought) { btn.innerText = 'Куплено'; btn.disabled = true; }
          else if (next) {
            btn.innerText = 'Купить ' + formatMoney(u.cost,1) + ' ₽';
            btn.onclick = (function(upg, level) {
              return function() {
                if (balance >= upg.cost) {
                  balance -= upg.cost;
                  tapValue = upg.value;
                  maxUpgrade = level;
                  updateUI();
                  renderUpgrades();
                } else alert('Недостаточно средств!');
              };
            })(u, lvl);
          } else {
            btn.innerText = 'Сначала предыдущее';
            btn.disabled = true;
          }
          card.appendChild(btn);
          list.appendChild(card);
        }
      } else {
        // Автокликер
        if (!hasAutoclicker) {
          var card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = '<div class="card-content"><div class="card-title">Купить автокликер</div><div class="card-desc">+0.0001 ₽ каждые 50 сек</div></div>';
          var btn = document.createElement('button');
          btn.className = 'btn';
          btn.style.cssText = 'width:auto;margin:0;padding:8px 10px;font-size:9px;';
          btn.innerText = 'Купить 100 ₽';
          btn.onclick = function() {
            if (balance >= 100) {
              balance -= 100;
              hasAutoclicker = true;
              updateUI();
              startAutoclicker();
              renderUpgrades();
            } else alert('Недостаточно средств!');
          };
          card.appendChild(btn);
          list.appendChild(card);
        } else {
          var t1 = document.createElement('div');
          t1.className = 'section-title';
          t1.innerText = 'Сила авто';
          list.appendChild(t1);

          for (var v = 0; v < autoValueData.length; v++) {
            var av = autoValueData[v];
            var bought = autoValueLevel >= av.level;
            var next = autoValueLevel + 1 === av.level;
            var card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = '<div class="card-content"><div class="card-title">Сила Lv.' + av.level + '</div><div class="card-desc">+' + formatMoney(av.value,4) + ' ₽</div></div>';
            var btn = document.createElement('button');
            btn.className = 'btn';
            btn.style.cssText = 'width:auto;margin:0;padding:8px 10px;font-size:9px;';
            if (bought) { btn.innerText = 'Куплено'; btn.disabled = true; }
            else if (next) {
              btn.innerText = 'Купить ' + formatMoney(av.cost,0) + ' ₽';
              btn.onclick = (function(a) {
                return function() {
                  if (balance >= a.cost) {
                    balance -= a.cost;
                    autoValue = a.value;
                    autoValueLevel = a.level;
                    updateUI();
                    startAutoclicker();
                    renderUpgrades();
                  } else alert('Недостаточно средств!');
                };
              })(av);
            } else { btn.innerText = 'Сначала предыдущее'; btn.disabled = true; }
            card.appendChild(btn);
            list.appendChild(card);
          }

          var t2 = document.createElement('div');
          t2.className = 'section-title';
          t2.innerText = 'Скорость авто';
          list.appendChild(t2);

          for (var s = 0; s < autoSpeedData.length; s++) {
            var as = autoSpeedData[s];
            var bought = autoSpeedLevel >= as.level;
            var next = autoSpeedLevel + 1 === as.level;
            var card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = '<div class="card-content"><div class="card-title">Скорость Lv.' + as.level + '</div><div class="card-desc">Интервал: ' + (as.interval/1000) + ' сек</div></div>';
            var btn = document.createElement('button');
            btn.className = 'btn';
            btn.style.cssText = 'width:auto;margin:0;padding:8px 10px;font-size:9px;';
            if (bought) { btn.innerText = 'Куплено'; btn.disabled = true; }
            else if (next) {
              btn.innerText = 'Купить ' + formatMoney(as.cost,0) + ' ₽';
              btn.onclick = (function(a) {
                return function() {
                  if (balance >= a.cost) {
                    balance -= a.cost;
                    autoInterval = a.interval;
                    autoSpeedLevel = a.level;
                    updateUI();
                    startAutoclicker();
                    renderUpgrades();
                  } else alert('Недостаточно средств!');
                };
              })(as);
            } else { btn.innerText = 'Сначала предыдущее'; btn.disabled = true; }
            card.appendChild(btn);
            list.appendChild(card);
          }
        }
      }
    }

    function renderQuests() {
      var list = getEl('questsList');
      if (!list) return;
      list.innerHTML = '';
      for (var i = 0; i < questsData.length; i++) {
        var q = questsData[i];
        var isClaimed = claimed.indexOf(q.id) !== -1;
        var canClaim = !isClaimed && totalTaps >= q.need;
        var card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = '<div class="card-content"><div class="card-title">Натапать ' + formatMoney(q.need,0) + ' раз</div><div class="card-desc">Прогресс: ' + formatMoney(Math.min(totalTaps,q.need),0) + ' / ' + formatMoney(q.need,0) + '</div></div>';
        var btn = document.createElement('button');
        btn.className = 'btn';
        btn.style.cssText = 'width:auto;margin:0;padding:8px 10px;font-size:9px;';
        if (isClaimed) { btn.innerText = 'Получено'; btn.disabled = true; }
        else if (canClaim) {
          btn.innerText = 'Забрать +' + formatMoney(q.reward,1) + ' ₽';
          btn.style.background = '#10b981';
          btn.onclick = (function(quest) {
            return function() {
              balance += quest.reward;
              claimed.push(quest.id);
              updateUI();
              renderQuests();
            };
          })(q);
        } else {
          btn.innerText = 'Ещё не выполнено';
          btn.disabled = true;
        }
        card.appendChild(btn);
        list.appendChild(card);
      }
    }

    function renderShop() {
      var list = getEl('shopList');
      if (!list) return;
      list.innerHTML = '';
      for (var i = 0; i < skinsData.length; i++) {
        var skin = skinsData[i];
        var owned = ownedSkins.indexOf(skin.id) !== -1;
        var equipped = equippedSkin === skin.id;
        var card = document.createElement('div');
        card.className = 'card shop-card';
        var btnHtml = '';
        if (equipped) btnHtml = '<button class="btn btn-green" disabled>Надето</button>';
        else if (owned) btnHtml = '<button class="btn" onclick="equipSkin(' + skin.id + ')">Надеть</button>';
        else btnHtml = '<button class="btn btn-blue" onclick="buySkin(' + skin.id + ')">Купить ' + formatMoney(skin.price,0) + ' ₽</button>';
        card.innerHTML = '<div class="shop-preview">' + skin.emoji + '</div><div class="card-title">' + skin.name + '</div>' + btnHtml;
        list.appendChild(card);
      }
    }

    function renderBlackMarket() {
      var list = getEl('blackMarketList');
      if (!list) return;
      list.innerHTML = '';
      if (!activeEvents.blackMarket) return;
      if (currentBlackMarketItems.length === 0) generateBlackMarket();

      for (var i = 0; i < currentBlackMarketItems.length; i++) {
        var item = currentBlackMarketItems[i];
        var card = document.createElement('div');
        card.className = 'card shop-card';
        card.innerHTML = '<div class="shop-preview">' + item.emoji + '</div><div class="card-title">' + item.name + '</div><button class="btn btn-dark" onclick="buyBlackItem(\'' + item.id + '\')">' + formatMoney(item.price,0) + ' ₽</button>';
        list.appendChild(card);
      }
    }

    window.buySkin = function(id) {
      var skin = skinsData.find(function(s){ return s.id === id; });
      if (balance >= skin.price) {
        balance -= skin.price;
        ownedSkins.push(id);
        updateUI();
        renderShop();
      } else alert('Недостаточно средств!');
    };
    window.equipSkin = function(id) {
      equippedSkin = id;
      var display = getEl('potatoDisplay');
      var skin = skinsData.find(function(s){ return s.id === id; });
      if (display && skin) display.innerText = skin.emoji;
      save();
      renderShop();
    };
    window.buyBlackItem = function(id) {
      var item = currentBlackMarketItems.find(function(i){ return i.id === id; });
      if (!item) return;
      if (balance >= item.price) {
        balance -= item.price;
        currentBlackMarketItems = currentBlackMarketItems.filter(function(i){ return i.id !== id; });
        localStorage.setItem('currentBlackMarketItems', JSON.stringify(currentBlackMarketItems));
        updateUI();
        renderBlackMarket();
        alert('Куплено: ' + item.name);
      } else alert('Недостаточно средств!');
    };

    window.switchShopTab = function(tab) {
      var skins = getEl('shopContentSkins');
      var black = getEl('shopContentBlack');
      var gifts = getEl('shopContentGifts');
      var tabs = document.querySelectorAll('.shop-tab-btn');
      tabs.forEach(function(t){ t.classList.remove('active'); });

      if (tab === 'skins') {
        if (skins) skins.style.display = 'block';
        if (black) black.style.display = 'none';
        if (gifts) gifts.style.display = 'none';
        tabs[0].classList.add('active');
        renderShop();
      } else if (tab === 'black') {
        if (skins) skins.style.display = 'none';
        if (black) black.style.display = 'block';
        if (gifts) gifts.style.display = 'none';
        tabs[2].classList.add('active');
        renderBlackMarket();
      } else {
        if (skins) skins.style.display = 'none';
        if (black) black.style.display = 'none';
        if (gifts) gifts.style.display = 'block';
        tabs[1].classList.add('active');
      }
    };

    window.withdrawMoney = function() {
      if (balance < 10) { alert('Минимум 10 ₽'); return; }
      alert('Вывод ' + formatMoney(balance) + ' ₽ (тест)');
      balance = 0;
      updateUI();
    };

    // ===== НАВИГАЦИЯ =====
    function showScreen(name) {
      var screens = document.querySelectorAll('.screen');
      for (var i = 0; i < screens.length; i++) screens[i].classList.remove('active');
      var target = getEl('screen-' + name);
      if (target) target.classList.add('active');

      var items = document.querySelectorAll('.menu-item');
      for (var i = 0; i < items.length; i++) {
        items[i].classList.remove('active');
        if (items[i].getAttribute('data-screen') === name) items[i].classList.add('active');
      }

      if (name === 'upgrades') renderUpgrades();
      if (name === 'quests') renderQuests();
      if (name === 'shop') switchShopTab('skins');
      if (name === 'profile') loadUser();
    }

    function loadUser() {
      var photo = '';
      var name = 'Игрок';
      try {
        if (window.Telegram && Telegram.WebApp && Telegram.WebApp.initDataUnsafe && Telegram.WebApp.initDataUnsafe.user) {
          var u = Telegram.WebApp.initDataUnsafe.user;
          if (u.photo_url) photo = u.photo_url;
          if (u.username) name = '@' + u.username;
          else if (u.first_name) name = u.first_name;
        }
      } catch(e){}
      if (!photo) photo = 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="50" fill="%234c1d95"/><text x="50" y="62" font-size="40" text-anchor="middle" fill="white">🥔</text></svg>';
      
      var topA = getEl('topAvatar');
      var profA = getEl('profileAvatar');
      var profN = getEl('profileName');
      if (topA) topA.src = photo;
      if (profA) profA.src = photo;
      if (profN) profN.innerText = name;
    }

    // ===== ИНИЦИАЛИЗАЦИЯ =====
    var potatoBtn = getEl('potatoBtn');
    if (potatoBtn) {
      potatoBtn.addEventListener('touchstart', handleTap, {passive:false});
      potatoBtn.addEventListener('mousedown', handleTap);
    }

    getEl('openProfile').onclick = function() { showScreen('profile'); };

    var menuItems = document.querySelectorAll('.menu-item');
    for (var i = 0; i < menuItems.length; i++) {
      menuItems[i].onclick = function() {
        showScreen(this.getAttribute('data-screen'));
      };
    }

    getEl('tabTap').onclick = function() {
      currentTab = 'tap';
      this.classList.add('active');
      getEl('tabAuto').classList.remove('active');
      renderUpgrades();
    };
    getEl('tabAuto').onclick = function() {
      currentTab = 'auto';
      this.classList.add('active');
      getEl('tabTap').classList.remove('active');
      renderUpgrades();
    };

    var devCount = 0;
    getEl('devBtn').onclick = function() {
      devCount++;
      if (devCount >= 5) {
        balance += 200000;
        totalTaps += 50000;
        updateUI();
        alert('+200 000 ₽ и +50 000 тапов!');
        devCount = 0;
      }
    };

    // Старт
    try {
      if (window.Telegram && Telegram.WebApp) {
        Telegram.WebApp.ready();
        Telegram.WebApp.expand();
      }
    } catch(e){}

    loadUser();
    updateUI();
    if (hasAutoclicker) startAutoclicker();
    checkEvents();
    setInterval(checkEvents, 60000);

    console.log('Картоха загружена. События готовы.');
  </script>
</body>
</html>
