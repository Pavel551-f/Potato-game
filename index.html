<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Картоха</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
    body {
      background: linear-gradient(180deg, #2e1065, #1e1b4b);
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #error-screen { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #991b1b; z-index: 9999; padding: 20px; color: white; font-family: monospace; font-size: 14px; }

    .top-balance { position: absolute; top: 14px; left: 14px; display: flex; align-items: center; gap: 10px; background: rgba(0,0,0,0.45); border-radius: 50px; padding: 5px 14px 5px 5px; z-index: 60; cursor: pointer; }
    .top-avatar { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; border: 2px solid #a855f7; background: #4c1d95; }
    .top-balance-text { display: flex; flex-direction: column; }
    .top-balance-label { font-size: 11px; color: #c4b5fd; }
    .top-balance-value { font-size: 16px; font-weight: 700; }

    .shop-btn-main {
      position: absolute; top: 70px; left: 14px;
      display: flex; align-items: center; gap: 8px;
      background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.2);
      border-radius: 12px; padding: 8px 14px;
      cursor: pointer; z-index: 60;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    .shop-btn-main:active { background: rgba(0,0,0,0.8); }
    .shop-btn-main span {
      font-family: 'Impact', 'Arial Black', sans-serif;
      font-style: italic; letter-spacing: 1px; font-size: 18px;
      color: #fff; text-shadow: 0 0 5px #a855f7;
      text-transform: uppercase;
    }

    .screen { flex: 1; display: none; flex-direction: column; overflow-y: auto; }
    .screen.active { display: flex; }

    .main-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding-top: 70px; }
    
    .potato-wrap { width: 220px; height: 220px; cursor: pointer; display: flex; align-items: center; justify-content: center; position: relative; z-index: 10; }
    .potato-emoji { font-size: 140px; transition: transform 0.1s; pointer-events: none; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.5)); }
    .potato-wrap:active .potato-emoji { transform: scale(0.92); }
    
    .potato-wrap img { max-width: 100%; max-height: 100%; object-fit: contain; pointer-events: none; transition: transform 0.1s; }
    .potato-wrap:active img { transform: scale(0.92); }

    .tap-power { margin-top: 16px; font-size: 15px; color: #c4b5fd; }
    .auto-info { margin-top: 10px; font-size: 13px; color: #a78bfa; }

    .tabs { display: flex; gap: 8px; padding: 80px 16px 12px; }
    .tab-btn { flex: 1; padding: 11px 6px; border: none; border-radius: 12px; font-size: 13px; font-weight: 600; background: rgba(255,255,255,0.08); color: #c4b5fd; cursor: pointer; }
    .tab-btn.active { background: linear-gradient(135deg, #c084fc, #a855f7); color: white; }
    .list-content { padding: 0 16px 30px; }
    #screen-quests .list-content, #screen-achievements .list-content, #screen-shop .list-content { padding-top: 80px; }
    
    .card { background: rgba(255,255,255,0.09); border-radius: 16px; padding: 16px; margin-bottom: 12px; display: flex; align-items: center; gap: 15px; border: 1px solid transparent; transition: all 0.3s ease; }
    .card-icon { font-size: 30px; flex-shrink: 0; width: 45px; text-align: center; }
    .card-content { flex: 1; }
    .card-title { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
    .card-desc { font-size: 13px; color: #c4b5fd; margin-bottom: 6px; }
    .card-status { font-size: 12px; font-weight: 700; }
    .status-locked { color: #6b7280; }
    .status-unlocked { color: #10b981; }
    
    /* === 100% РАБОЧАЯ RGB ПОДСВЕТКА === */
    .rgb-glow {
      border: 2px solid #ff0055 !important;
      background-color: rgba(255, 255, 255, 0.15) !important;
      box-shadow: 0 0 15px rgba(255, 0, 85, 0.8), inset 0 0 10px rgba(255, 0, 85, 0.5) !important;
      animation: hueRotate 3s linear infinite !important;
    }
    @keyframes hueRotate {
      0% { filter: hue-rotate(0deg); }
      100% { filter: hue-rotate(360deg); }
    }

    .section-title { font-size: 14px; color: #a78bfa; margin: 14px 0 10px; font-weight: 600; }
    .btn { background: linear-gradient(135deg, #c084fc, #a855f7); border: none; color: white; padding: 11px; border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer; margin-bottom: 10px; }
    .btn:disabled { background: #4b5563; color: #9ca3af; }
    
    .btn-green { background: #10b981; }
    .btn-blue { background: #3b82f6; }
    .btn-grey { background: rgba(255,255,255,0.1); border: 1px solid #a855f7; }

    .shop-card { flex-direction: column; text-align: center; justify-content: center; padding: 20px; gap: 10px; }
    .shop-preview { font-size: 80px; margin-bottom: 5px; filter: drop-shadow(0 5px 10px rgba(0,0,0,0.5)); height: 80px; display: flex; align-items: center; justify-content: center; }
    .shop-preview img { width: 80px; height: 80px; object-fit: contain; }
    .shop-card .btn { width: 100%; margin-bottom: 0; }

    .profile-content { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 70px 20px 30px; position: relative; }
    .profile-avatar { width: 110px; height: 110px; border-radius: 50%; object-fit: cover; border: 3px solid #a855f7; margin-bottom: 18px; background: #4c1d95; }
    .profile-name { font-size: 22px; font-weight: 700; margin-bottom: 20px; text-align: center; }
    
    .profile-bottom { width: 100%; margin-top: auto; }
    .progress-label { font-size: 13px; color: #c4b5fd; margin-bottom: 8px; display: flex; justify-content: space-between; }
    .progress-bar { height: 8px; background: rgba(255,255,255,0.15); border-radius: 10px; overflow: hidden; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, #c084fc, #a855f7); width: 0%; transition: width 0.3s; }
    .progress-hint { font-size: 12px; color: #9ca3af; margin-top: 10px; text-align: center; }

    .lang-btn-top { position: absolute; top: 14px; right: 14px; display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.1); border-radius: 20px; padding: 8px 14px; cursor: pointer; font-weight: 700; font-size: 15px; color: #e9d5ff; border: 1px solid rgba(255,255,255,0.2); z-index: 60; }

    .rating-container { flex: 1; overflow-y: auto; padding: 80px 16px 100px; }
    .rating-row { display: flex; align-items: center; padding: 16px; border-radius: 16px; margin-bottom: 12px; background: linear-gradient(90deg, rgba(234, 179, 8, 0.15) 0%, rgba(26, 26, 33, 0.8) 100%); border: 1px solid rgba(234, 179, 8, 0.4); }
    .rating-rank { width: 40px; height: 40px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 18px; font-weight: 800; margin-right: 12px; background: #eab308; color: #000; flex-shrink: 0; }
    .rating-avatar { width: 50px; height: 50px; border-radius: 50%; margin-right: 12px; object-fit: cover; background: #333; border: 2px solid #fff; flex-shrink: 0; }
    .rating-info { flex: 1; display: flex; flex-direction: column; }
    .rating-name { font-size: 18px; font-weight: 700; }
    .rating-score { font-size: 14px; color: #fde047; font-weight: 600; margin-top: 4px; }
    .my-rating-box { position: fixed; bottom: 70px; left: 0; right: 0; background: #1a1625; border-top: 1px solid rgba(255,255,255,0.1); padding: 12px 16px; display: flex; align-items: center; z-index: 50; justify-content: center; }
    .my-rating-box .rating-name { color: #a855f7; font-size: 16px; }

    .bottom-menu { height: 70px; background: #1a1625; display: flex; border-top: 1px solid rgba(255,255,255,0.08); z-index: 100; }
    .menu-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; color: #9ca3af; cursor: pointer; }
    .menu-item.active { color: #e9d5ff; }
    .menu-icon { font-size: 22px; }

    .float-text { position: fixed; font-size: 24px; font-weight: 800; color: #f5d0fe; text-shadow: 0 2px 4px rgba(0,0,0,0.5); pointer-events: none; z-index: 100; animation: floatUp 0.8s ease-out forwards; }
    @keyframes floatUp { 0% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -150%) scale(1.5); } }

    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; }
    .modal-content { background: #2e1065; padding: 20px; border-radius: 20px; width: 80%; max-width: 300px; text-align: center; border: 1px solid #a855f7; }
    .modal-content h3 { margin-bottom: 15px; font-size: 18px; }
    .modal-btn { background: rgba(255,255,255,0.1); border: 1px solid #a855f7; color: white; padding: 12px; border-radius: 12px; width: 100%; margin-bottom: 10px; font-size: 16px; cursor: pointer; transition: 0.2s; }
    .modal-btn:hover { background: #a855f7; }

    .wood-medal-container { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 50px; }
    .wood-medal { width: 45px; height: 45px; }
  </style>
</head>
<body>

  <div id="error-screen"></div>

  <div class="modal-overlay" id="langModal">
    <div class="modal-content">
      <h3 data-i18n="lang_title">Выберите язык / Choose language</h3>
      <button class="modal-btn" onclick="changeLang('ru')">🇷🇺 Русский</button>
      <button class="modal-btn" onclick="changeLang('en')">🇬🇧 English</button>

  </div>

  <div class="top-balance" id="openProfile">
    <img class="top-avatar" id="topAvatar" src="" alt="">
    <div class="top-balance-text">
      <div class="top-balance-label" data-i18n="balance_label">Ваш баланс</div>
      <div class="top-balance-value" id="balance">0.000</div>
    </div>
  </div>

  <div class="screen active" id="screen-main">
    <div class="shop-btn-main" onclick="showScreen('shop')">
      🛒 <span>Магазин</span>
    </div>

      <div class="tap-power"><span data-i18n="tap_label">Тап</span>: <span id="tapPower">0.001</span> ₽</div>

  </div>

  <div class="screen" id="screen-shop">

    <div class="list-content" id="shopList" style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding-top: 10px;"></div>

  <div class="screen" id="screen-upgrades">
    <div class="tabs">
      <button class="tab-btn active" id="tabTap" data-i18n="tab_tap">Ул. тапа</button>

    <div class="list-content" id="upgradesList"></div>

  <div class="screen" id="screen-quests">
    <div class="list-content" id="questsList"></div>
  </div>

  <div class="screen" id="screen-achievements">
    <div class="list-content" id="achievementsList"></div>
  </div>

  <div class="screen" id="screen-rating">
    <div class="rating-container" id="leaderboardList"></div>
    <div class="my-rating-box">
       <div class="rating-name" data-i18n="rating_leader">🏆 Вы — Лидер проекта!</div>
    </div>
  </div>

  <div class="screen" id="screen-profile">
    <div class="profile-content">
      <div class="lang-btn-top" onclick="openLangMenu()">
        🌐 <span id="currentLangText">RU</span>
      </div>
      <img class="profile-avatar" id="profileAvatar" src="" alt="">
      <div class="profile-name" id="profileName" data-i18n="player">Игрок</div>
      
      <div class="profile-bottom">
        <button class="btn btn-grey" onclick="showScreen('achievements')" data-i18n="achievements_btn">🏆 Достижения / Achievements</button>
        <button class="btn btn-green" onclick="withdrawMoney()" data-i18n="withdraw">Вывести средства</button>

        <div class="progress-label" style="margin-top: 20px;"><span data-i18n="total_taps">Всего тапов</span><span id="totalTapsText">0</span></div>
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <div class="progress-hint" data-i18n="taps_hint">Число тапов, чтобы друзья могли посмотреть</div>
        
        <div id="devBtn" style="margin-top: 20px; font-size: 10px; color: #4b5563; text-align: center; cursor: pointer;" data-i18n="dev_btn">Нажми 5 раз для теста</div>
      </div>
    </div>
  </div>

  <div class="bottom-menu">
    <div class="menu-item active" data-screen="main"><div class="menu-icon">☕</div><div data-i18n="menu_main">Главная</div></div>
    <div class="menu-item" data-screen="upgrades"><div class="menu-icon">⚡</div><div data-i18n="menu_upgrades">Улучшения</div></div>
    <div class="menu-item" data-screen="rating"><div class="menu-icon">🏆</div><div data-i18n="menu_rating">Рейтинг</div></div>
    <div class="menu-item" data-screen="quests"><div class="menu-icon">⏳</div><div data-i18n="menu_quests">Квесты</div></div>
  </div>

  <script>
    window.onerror = function(msg, url, line) {
      var err = document.getElementById('error-screen');
      if(err) { err.style.display = 'block'; err.innerHTML += "<p><b>ОШИБКА:</b> " + msg + "<br>Строка: " + line + "</p>"; }
      return false;
    };

    var audioCtx = null;
    function initAudio() {
      if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {} }
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    }
    document.body.addEventListener('click', initAudio, { once: true });
    document.body.addEventListener('touchstart', initAudio, { once: true });

    function playSound(type) {
      if (!audioCtx) return;
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      var now = audioCtx.currentTime;
      
      if (type === 'upgrade') {
        osc.type = 'sine'; osc.frequency.setValueAtTime(440, now); osc.frequency.exponentialRampToValueAtTime(880, now + 0.1);
        gain.gain.setValueAtTime(0.3, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
        osc.start(now); osc.stop(now + 0.3);
      } else if (type === 'quest_ready') {
        osc.type = 'triangle'; osc.frequency.setValueAtTime(600, now); osc.frequency.setValueAtTime(800, now + 0.1);
        gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
        osc.start(now); osc.stop(now + 0.4);
      } else if (type === 'quest_claim') {
        osc.type = 'square'; osc.frequency.setValueAtTime(987.77, now); osc.frequency.setValueAtTime(1318.51, now + 0.1);
        gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
        osc.start(now); osc.stop(now + 0.4);
      } else if (type === 'achievement') {
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(440, now); osc.frequency.setValueAtTime(554.37, now + 0.1); osc.frequency.setValueAtTime(659.25, now + 0.2);
        gain.gain.setValueAtTime(0.15, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.5);
        osc.start(now); osc.stop(now + 0.5);
      }
    }

    var translations = {
      ru: {
        balance_label: "Ваш баланс", tap_label: "Тап", tab_tap: "Ул. тапа", tab_auto: "Ул. автокликера",
        rating_leader: "🏆 Вы — Лидер проекта!", player: "Игрок", legend: "Легенда",
        total_taps: "Всего тапов", taps_hint: "Число тапов, чтобы друзья могли посмотреть",
        withdraw: "Вывести средства", dev_btn: "Нажми 5 раз для теста",
        menu_main: "Главная", menu_upgrades: "Улучшения", menu_rating: "Рейтинг", menu_quests: "Квесты",
        lang_title: "Выберите язык", cancel: "Отмена", bought: "Куплено", buy_for: "Купить за", 
        buy_prev: "Сначала купи предыдущее", auto_buy: "Купить автокликер", auto_desc: "Даёт +0.0001 ₽ каждые 50 секунд",
        auto_power: "Сила автокликера", auto_speed: "Скорость автокликера", gives: "Даёт", interval: "Интервал",
        sec: "сек", balance: "Баланс", make_taps: "Сделай", taps_word: "тапов", progress: "Прогресс",
        claim: "Забрать", received: "Получено", not_done: "Ещё не выполнено",
        upg_names: ["Улучшенный тап", "Сильный тап", "Мощный тап", "Супер тап", "Мега тап", "Гипер тап", "Ультра тап", "Турбо тап", "Космический тап", "Божественный тап"],
        upg_desc: "Каждый тап даёт",
        achievements_btn: "🏆 Достижения / Achievements", ach_unlocked: "Получено ✨", ach_locked: "Заблокировано",
        shop_title: "🛒 Магазин скинов", equip: "Надеть", equipped: "Надето", buy: "Купить",
        ach_list: [
          { title: "Первый шаг", desc: "Натапать 100 раз", icon: "🌱" },
          { title: "Картофельный фанат", desc: "Натапать 1 000 раз", icon: "🥔" },
          { title: "Мастер клика", desc: "Натапать 10 000 раз", icon: "🔥" },
          { title: "Деревянная легенда", desc: "Натапать 20 000 раз", icon: "wood" },
          { title: "Богач", desc: "Накопить 100 ₽", icon: "💰" },
          { title: "Автоматизация", desc: "Купить автокликер", icon: "⚙️" },
          { title: "Прокачка", desc: "Купить 5-й уровень тапа", icon: "⚡" },
          { title: "Максимальный тап", desc: "Купить Божественный тап", icon: "🌟" }
        ]
      },
      en: {
        balance_label: "Your balance", tap_label: "Tap", tab_tap: "Tap Upg.", tab_auto: "Auto Upg.",
        rating_leader: "🏆 You are the Project Leader!", player: "Player", legend: "Legend",
        total_taps: "Total taps", taps_hint: "Number of taps for friends to see",
        withdraw: "Withdraw funds", dev_btn: "Press 5 times to test",
        menu_main: "Main", menu_upgrades: "Upgrades", menu_rating: "Rating", menu_quests: "Quests",
        lang_title: "Choose language", cancel: "Cancel", bought: "Bought", buy_for: "Buy for", 
        buy_prev: "Buy previous first", auto_buy: "Buy Autoclicker", auto_desc: "Gives +0.0001 ₽ every 50 seconds",
        auto_power: "Autoclicker Power", auto_speed: "Autoclicker Speed", gives: "Gives", interval: "Interval",
        sec: "sec", balance: "Balance", make_taps: "Make", taps_word: "taps", progress: "Progress",
        claim: "Claim", received: "Received", not_done: "Not completed yet",
        upg_names: ["Improved Tap", "Strong Tap", "Powerful Tap", "Super Tap", "Mega Tap", "Hyper Tap", "Ultra Tap", "Turbo Tap", "Cosmic Tap", "Divine Tap"],
        upg_desc: "Each tap gives",
        achievements_btn: "🏆 Achievements / Достижения", ach_unlocked: "Unlocked ✨", ach_locked: "Locked",
        shop_title: "🛒 Skin Shop", equip: "Equip", equipped: "Equipped", buy: "Buy",
        ach_list: [
          { title: "First Step", desc: "Tap 100 times", icon: "🌱" },
          { title: "Potato Fan", desc: "Tap 1,000 times", icon: "🥔" },
          { title: "Click Master", desc: "Tap 10,000 times", icon: "🔥" },
          { title: "Wooden Legend", desc: "Tap 20,000 times", icon: "wood" },
          { title: "Rich Man", desc: "Save up to 100 ₽", icon: "💰" },
          { title: "Automation", desc: "Buy autoclicker", icon: "⚙️" },
          { title: "Upgraded", desc: "Buy 5th tap level", icon: "⚡" },
          { title: "Max Tap", desc: "Buy Divine Tap", icon: "🌟" }
        ]
      }
    };

    var currentLang = localStorage.getItem('potatoLang') || 'ru';
    var t = translations[currentLang];

    function applyTranslations() {
      var elements = document.querySelectorAll('[data-i18n]');
      for(var i = 0; i < elements.length; i++) {
        var key = elements[i].getAttribute('data-i18n');
        if(t[key]) elements[i].innerText = t[key];
      }
      document.getElementById('currentLangText').innerText = currentLang.toUpperCase();
      renderShop(); 
    }

    function openLangMenu() { document.getElementById('langModal').style.display = 'flex'; }
    function closeLangMenu() { document.getElementById('langModal').style.display = 'none'; }
    function changeLang(lang) { localStorage.setItem('potatoLang', lang); location.reload(); }

    var tg = null;
    try {
      if (window.Telegram && window.Telegram.WebApp) {
        tg = window.Telegram.WebApp; tg.ready(); tg.expand();
      }
    } catch(e) {}

    var upgradesData = [
      { nameIdx: 0, desc: 0.002, cost: 2.5, value: 0.002 }, { nameIdx: 1, desc: 0.003, cost: 4, value: 0.003 },
      { nameIdx: 2, desc: 0.004, cost: 8, value: 0.004 }, { nameIdx: 3, desc: 0.005, cost: 16, value: 0.005 },
      { nameIdx: 4, desc: 0.010, cost: 50, value: 0.010 }, { nameIdx: 5, desc: 0.020, cost: 100, value: 0.020 },
      { nameIdx: 6, desc: 0.030, cost: 150, value: 0.030 }, { nameIdx: 7, desc: 0.040, cost: 200, value: 0.040 },
      { nameIdx: 8, desc: 0.050, cost: 250, value: 0.050 }, { nameIdx: 9, desc: 0.100, cost: 500, value: 0.100 }
    ];
    
    var autoValueData = [
      { level: 1, cost: 50, value: 0.0002 }, { level: 2, cost: 60, value: 0.0003 }, { level: 3, cost: 70, value: 0.0004 }, { level: 4, cost: 80, value: 0.0005 },
      { level: 5, cost: 160, value: 0.001 }, { level: 6, cost: 180, value: 0.002 }, { level: 7, cost: 200, value: 0.003 }, { level: 8, cost: 225, value: 0.004 },
      { level: 9, cost: 250, value: 0.005 }, { level: 10, cost: 500, value: 0.01 }
    ];
    
    var autoSpeedData = [
      { level: 1, cost: 55, interval: 45000 }, { level: 2, cost: 65, interval: 40000 }, { level: 3, cost: 75, interval: 35000 }, { level: 4, cost: 100, interval: 30000 },
      { level: 5, cost: 150, interval: 25000 }, { level: 6, cost: 200, interval: 20000 }, { level: 7, cost: 250, interval: 15000 }, { level: 8, cost: 300, interval: 10000 },
      { level: 9, cost: 375, interval: 5000 }, { level: 10, cost: 500, interval: 1000 }
    ];
    
    var questsData = [
      { id: 1, need: 1000, reward: 0.5 }, { id: 2, need: 5000, reward: 1 },
      { id: 3, need: 10000, reward: 2 }, { id: 4, need: 15000, reward: 5 }, { id: 5, need: 20000, reward: 10 }
    ];

    // В МАГАЗИНЕ ТОЛЬКО 3 СКИНА (Деревянная убрана)
    var skinsData = [
      { id: 0, name: "Обычная", en_name: "Default", price: 0, emoji: "🥔", image: "potato.png" },
      { id: 1, name: "Золотая", en_name: "Golden", price: 500, emoji: "🥇", image: "potato_gold.png" },
      { id: 2, name: "Призрачная", en_name: "Ghost", price: 1000, emoji: "👻", image: "potato_ghost.png" }
    ];

    var balance = parseFloat(localStorage.getItem('potatoBalance')) || 0;
    var tapValue = parseFloat(localStorage.getItem('tapValue')) || 0.001;
    var maxUpgrade = parseInt(localStorage.getItem('maxUpgrade')) || 0;
    var totalTaps = parseInt(localStorage.getItem('totalTaps')) || 0;
    var claimed = JSON.parse(localStorage.getItem('claimed') || '[]');
    var unlockedAch = JSON.parse(localStorage.getItem('unlockedAch') || '[]');
    var hasAutoclicker = localStorage.getItem('hasAutoclicker') === 'true';
    var autoValue = parseFloat(localStorage.getItem('autoValue')) || 0.0001;
    var autoInterval = parseInt(localStorage.getItem('autoInterval')) || 50000;
    var autoValueLevel = parseInt(localStorage.getItem('autoValueLevel')) || 0;
    var autoSpeedLevel = parseInt(localStorage.getItem('autoSpeedLevel')) || 0;
    
    var ownedSkins = JSON.parse(localStorage.getItem('ownedSkins') || '[0]');
    var equippedSkin = parseInt(localStorage.getItem('equippedSkin')) || 0;
    
    var currentTab = 'tap';
    var autoTimer = null;
    var lastTapTime = 0;
    var userPhoto = '';
    var userName = t.player;
    var hasUnclaimedQuest = false;

    var balanceEl = document.getElementById('balance');
    var tapPowerEl = document.getElementById('tapPower');
    var potatoBtn = document.getElementById('potatoBtn');
    var potatoDisplay = document.getElementById('potatoDisplay');
    var upgradesList = document.getElementById('upgradesList');
    var questsList = document.getElementById('questsList');
    var achievementsList = document.getElementById('achievementsList');
    var shopList = document.getElementById('shopList');
    var autoInfo = document.getElementById('autoInfo');
    var totalTapsText = document.getElementById('totalTapsText');
    var progressFill = document.getElementById('progressFill');

    function save() {
      localStorage.setItem('potatoBalance', balance.toFixed(3));
      localStorage.setItem('tapValue', tapValue.toFixed(3));
      localStorage.setItem('maxUpgrade', maxUpgrade);
      localStorage.setItem('totalTaps', totalTaps);
      localStorage.setItem('claimed', JSON.stringify(claimed));
      localStorage.setItem('unlockedAch', JSON.stringify(unlockedAch));
      localStorage.setItem('hasAutoclicker', hasAutoclicker);
      localStorage.setItem('autoValue', autoValue.toFixed(4));
      localStorage.setItem('autoInterval', autoInterval);
      localStorage.setItem('autoValueLevel', autoValueLevel);
      localStorage.setItem('autoSpeedLevel', autoSpeedLevel);
      localStorage.setItem('ownedSkins', JSON.stringify(ownedSkins));
      localStorage.setItem('equippedSkin', equippedSkin);
    }

    // === ЛОГИКА ЗАГРУЗКИ КАРТИНОК ДЛЯ СКИНОВ ===
    function updatePotatoSkin() {
      var skin = skinsData.find(s => s.id === equippedSkin);
      // Пытаемся загрузить картинку. Если ее нет на GitHub, показываем эмодзи
      potatoDisplay.innerHTML = `<img src="${skin.image}" draggable="false" onerror="this.style.display='none'; this.parentNode.innerHTML='${skin.emoji}';">`;
    }

    function updateUI() {
      balanceEl.innerText = balance.toFixed(3);
      tapPowerEl.innerText = tapValue.toFixed(3);
      totalTapsText.innerText = totalTaps;
      progressFill.style.width = Math.min(100, (totalTaps / 20000) * 100) + '%';
      checkAchievements();
      checkQuestReady();
      save();
    }

    function checkQuestReady() {
      if (hasUnclaimedQuest) return;
      for (var i = 0; i < questsData.length; i++) {
        var q = questsData[i];
        if (claimed.indexOf(q.id) === -1 && totalTaps >= q.need) {
          playSound('quest_ready'); hasUnclaimedQuest = true; break;
        }
      }
    }

    function checkAchievements() {
      var newUnlock = false;
      if (totalTaps >= 100 && unlockedAch.indexOf(0) === -1) { unlockedAch.push(0); newUnlock = true; }
      if (totalTaps >= 1000 && unlockedAch.indexOf(1) === -1) { unlockedAch.push(1); newUnlock = true; }
      if (totalTaps >= 10000 && unlockedAch.indexOf(2) === -1) { unlockedAch.push(2); newUnlock = true; }
      if (totalTaps >= 20000 && unlockedAch.indexOf(3) === -1) { unlockedAch.push(3); newUnlock = true; }
      if (balance >= 100 && unlockedAch.indexOf(4) === -1) { unlockedAch.push(4); newUnlock = true; }
      if (hasAutoclicker && unlockedAch.indexOf(5) === -1) { unlockedAch.push(5); newUnlock = true; }
      if (maxUpgrade >= 5 && unlockedAch.indexOf(6) === -1) { unlockedAch.push(6); newUnlock = true; }
      if (maxUpgrade >= 10 && unlockedAch.indexOf(7) === -1) { unlockedAch.push(7); newUnlock = true; }

      if (newUnlock) { playSound('achievement'); save(); }
    }

    function updateAutoInfo() {
      if (hasAutoclicker) {
        autoInfo.style.display = 'block';
        var text = currentLang === 'ru' 
          ? 'Автокликер: +' + autoValue.toFixed(4) + ' ₽ каждые ' + (autoInterval / 1000) + ' сек'
          : 'Autoclicker: +' + autoValue.toFixed(4) + ' ₽ every ' + (autoInterval / 1000) + ' sec';
        autoInfo.innerText = text;
      } else { autoInfo.style.display = 'none'; }
    }

    function startAutoclicker() {
      if (autoTimer) clearInterval(autoTimer);
      if (!hasAutoclicker) return;
      autoTimer = setInterval(function() { balance += autoValue; updateUI(); }, autoInterval);
    }

    function handleTap(e) {
      var now = Date.now();
      if (now - lastTapTime < 50) return;
      lastTapTime = now;
      if (e.cancelable) e.preventDefault();
      if (tg && tg.HapticFeedback) { try { tg.HapticFeedback.impactOccurred('light'); } catch(err) {} }

      balance += tapValue;
      totalTaps += 1;
      updateUI();

      var float = document.createElement('div');
      float.className = 'float-text';
      float.innerText = '+' + tapValue.toFixed(3);
      
      var clientX = window.innerWidth / 2; var clientY = window.innerHeight / 2;
      if (e.touches && e.touches[0]) { clientX = e.touches[0].clientX; clientY = e.touches[0].clientY; } 
      else if (e.clientX) { clientX = e.clientX; clientY = e.clientY; }

      float.style.left = clientX + 'px'; float.style.top = clientY + 'px';
      document.body.appendChild(float);
      setTimeout(function() { if (float.parentNode) float.parentNode.removeChild(float); }, 800);
    }

    if (potatoBtn) {
      potatoBtn.addEventListener('touchstart', handleTap, { passive: false });
      potatoBtn.addEventListener('mousedown', handleTap);
    }

    function renderShop() {
      if (!shopList) return;
      shopList.innerHTML = '';
      for (var i = 0; i < skinsData.length; i++) {
        var skin = skinsData[i];
        var isOwned = ownedSkins.indexOf(skin.id) !== -1;
        var isEquipped = equippedSkin === skin.id;
        
        var skinName = currentLang === 'en' ? skin.en_name : skin.name;

        var card = document.createElement('div');
        card.className = 'card shop-card';
        
        var previewStyle = (!isOwned && skin.id !== 0) ? 'filter: grayscale(100%) opacity(0.5);' : '';
        
        var btnHtml = '';
        if (isEquipped) {
          btnHtml = `<button class="btn btn-green" disabled>${t.equipped}</button>`;
        } else if (isOwned) {
          btnHtml = `<button class="btn" onclick="equipSkin(${skin.id})">${t.equip}</button>`;
        } else {
          btnHtml = `<button class="btn btn-blue" onclick="buySkin(${skin.id})">${t.buy} (${skin.price} ₽)</button>`;
        }

        // Пытаемся загрузить картинку для превью в магазине
        var previewHtml = `<img src="${skin.image}" style="${previewStyle}" onerror="this.style.display='none'; this.parentNode.innerHTML='<span style=\\'${previewStyle}\\'>${skin.emoji}</span>';">`;

        card.innerHTML = `
          <div class="shop-preview">${previewHtml}</div>
          <div class="card-title" style="margin-bottom: 8px;">${skinName}</div>
          ${btnHtml}
        `;
        shopList.appendChild(card);
      }
    }

    window.buySkin = function(id) {
      var skin = skinsData.find(s => s.id === id);
      if (balance >= skin.price) {
        balance -= skin.price;
        ownedSkins.push(id);
        playSound('upgrade');
        updateUI();
        renderShop();
      } else {
        alert(currentLang === 'ru' ? 'Недостаточно средств!' : 'Not enough funds!');
      }
    }

    window.equipSkin = function(id) {
      equippedSkin = id;
      updatePotatoSkin();
      save();
      renderShop();
      if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
    }

    function renderUpgrades() {
      upgradesList.innerHTML = '';
      if (currentTab === 'tap') {
        for (var i = 0; i < upgradesData.length; i++) {
          var upg = upgradesData[i];
          var level = i + 1;
          var isBought = level <= maxUpgrade;
          var isNext = level === maxUpgrade + 1;
          
          var btnText = isBought ? t.bought : (isNext ? t.buy_for + ' ' + upg.cost + ' ₽' : t.buy_prev);
          var upgName = t.upg_names[i];
          var upgDesc = t.upg_desc + ' ' + upg.desc.toFixed(3) + ' ₽';
          
          var card = document.createElement('div'); card.className = 'card';
          card.innerHTML = '<div class="card-content"><div class="card-title">' + upgName + '</div><div class="card-desc">' + upgDesc + '</div></div>';
          
          var btn = document.createElement('button');
          btn.className = 'btn';
          btn.style.width = 'auto'; btn.style.marginBottom = '0'; btn.style.padding = '8px 12px'; btn.style.fontSize = '12px';
          btn.innerText = btnText;
          if (!isNext) btn.disabled = true;

          if (isNext) {
            btn.onclick = (function(u, lvl) {
              return function() {
                if (balance >= u.cost) {
                  balance -= u.cost; tapValue = u.value; maxUpgrade = lvl;
                  playSound('upgrade');
                  updateUI(); renderUpgrades();
                  if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                } else alert(t.buy_prev);
              };
            })(upg, level);
          }
          card.appendChild(btn); upgradesList.appendChild(card);
        }
      } else {
        if (!hasAutoclicker) {
          var card = document.createElement('div'); card.className = 'card';
          card.innerHTML = '<div class="card-content"><div class="card-title">' + t.auto_buy + '</div><div class="card-desc">' + t.auto_desc + '</div></div>';
          var btn = document.createElement('button'); btn.className = 'btn'; 
          btn.style.width = 'auto'; btn.style.marginBottom = '0'; btn.style.padding = '8px 12px'; btn.style.fontSize = '12px';
          btn.innerText = t.buy_for + ' 100 ₽';
          btn.onclick = function() {
            if (balance >= 100) {
              balance -= 100; hasAutoclicker = true;
              playSound('upgrade');
              updateUI(); updateAutoInfo(); startAutoclicker(); renderUpgrades();
            } else alert(t.buy_prev);
          };
          card.appendChild(btn); upgradesList.appendChild(card);
        } else {
          var t1 = document.createElement('div'); t1.className = 'section-title'; t1.innerText = t.auto_power; upgradesList.appendChild(t1);
          for (var v = 0; v < autoValueData.length; v++) {
            var av = autoValueData[v];
            var isB = autoValueLevel >= av.level; var isN = autoValueLevel + 1 === av.level;
            var card = document.createElement('div'); card.className = 'card';
            card.innerHTML = '<div class="card-content"><div class="card-title">' + t.auto_power + ' Lv.' + av.level + '</div><div class="card-desc">' + t.gives + ' ' + av.value + ' ₽</div></div>';
            var btn = document.createElement('button'); btn.className = 'btn';
            btn.style.width = 'auto'; btn.style.marginBottom = '0'; btn.style.padding = '8px 12px'; btn.style.fontSize = '12px';
            btn.innerText = isB ? t.bought : (isN ? t.buy_for + ' ' + av.cost + ' ₽' : t.buy_prev);
            if (!isN) btn.disabled = true;
            if (isN) {
              btn.onclick = (function(a) {
                return function() {
                  if (balance >= a.cost) {
                    balance -= a.cost; autoValue = a.value; autoValueLevel = a.level;
                    playSound('upgrade');
                    updateUI(); updateAutoInfo(); startAutoclicker(); renderUpgrades();
                  } else alert(t.buy_prev);
                };
              })(av);
            }
            card.appendChild(btn); upgradesList.appendChild(card);
          }
          var t2 = document.createElement('div'); t2.className = 'section-title'; t2.innerText = t.auto_speed; upgradesList.appendChild(t2);
          for (var s = 0; s < autoSpeedData.length; s++) {
            var as = autoSpeedData[s];
            var isB = autoSpeedLevel >= as.level; var isN = autoSpeedLevel + 1 === as.level;
            var card = document.createElement('div'); card.className = 'card';
            card.innerHTML = '<div class="card-content"><div class="card-title">' + t.auto_speed + ' Lv.' + as.level + '</div><div class="card-desc">' + t.interval + ': ' + (as.interval/1000) + ' ' + t.sec + '</div></div>';
            var btn = document.createElement('button'); btn.className = 'btn';
            btn.style.width = 'auto'; btn.style.marginBottom = '0'; btn.style.padding = '8px 12px'; btn.style.fontSize = '12px';
            btn.innerText = isB ? t.bought : (isN ? t.buy_for + ' ' + as.cost + ' ₽' : t.buy_prev);
            if (!isN) btn.disabled = true;
            if (isN) {
              btn.onclick = (function(a) {
                return function() {
                  if (balance >= a.cost) {
                    balance -= a.cost; autoInterval = a.interval; autoSpeedLevel = a.level;
                    playSound('upgrade');
                    updateUI(); updateAutoInfo(); startAutoclicker(); renderUpgrades();
                  } else alert(t.buy_prev);
                };
              })(as);
            }
            card.appendChild(btn); upgradesList.appendChild(card);
          }
        }
      }
    }

    function renderQuests() {
      questsList.innerHTML = '';
      for (var i = 0; i < questsData.length; i++) {
        var q = questsData[i];
        var isClaimed = claimed.indexOf(q.id) !== -1;
        var canClaim = !isClaimed && totalTaps >= q.need;
        
        var titleText = currentLang === 'ru' ? 'Натапать ' + q.need + ' раз' : 'Tap ' + q.need + ' times';
        var descText = t.make_taps + ' ' + q.need + ' ' + t.taps_word;
        var progText = t.progress + ': ' + Math.min(totalTaps, q.need) + ' / ' + q.need;
        
        var card = document.createElement('div'); card.className = 'card';
        card.innerHTML = '<div class="card-content"><div class="card-title">' + titleText + '</div><div class="card-desc">' + descText + '</div><div style="margin-bottom: 0; color: #e9d5ff; font-size:12px;">' + progText + '</div></div>';
        
        var btn = document.createElement('button'); btn.className = 'btn';
        btn.style.width = 'auto'; btn.style.marginBottom = '0'; btn.style.padding = '8px 12px'; btn.style.fontSize = '12px';
        
        if (isClaimed) { btn.innerText = t.received; btn.disabled = true; }
        else if (canClaim) {
          btn.innerText = t.claim + ' (+' + q.reward + ' ₽)';
          btn.style.background = '#10b981';
          btn.onclick = (function(quest) {
            return function() {
              balance += quest.reward; claimed.push(quest.id);
              playSound('quest_claim');
              hasUnclaimedQuest = false;
              updateUI(); renderQuests();
              if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            };
          })(q);
        } else { btn.innerText = t.not_done; btn.disabled = true; }
        card.appendChild(btn); questsList.appendChild(card);
      }
    }

    function renderAchievements() {
      achievementsList.innerHTML = '';
      var achData = t.ach_list;

      for (var i = 0; i < achData.length; i++) {
        var isUnlocked = unlockedAch.indexOf(i) !== -1;
        var ach = achData[i];
        
        var card = document.createElement('div');
        card.className = 'card';
        
        if (isUnlocked) { 
          card.classList.add('rgb-glow'); 
        } else { 
          card.style.opacity = '0.5'; 
          card.style.filter = 'grayscale(100%)'; 
        }

        var iconHtml = ach.icon === 'wood' 
          ? `<div class="wood-medal-container"><svg class="wood-medal" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><path d="M50 10 C 80 10, 95 30, 90 60 C 85 85, 60 95, 40 90 C 15 85, 5 60, 10 35 C 15 15, 30 10, 50 10 Z" fill="#8B5A2B" stroke="#5C3A21" stroke-width="3"/><ellipse cx="35" cy="40" rx="4" ry="2" fill="#5C3A21" transform="rotate(-20 35 40)"/><ellipse cx="65" cy="55" rx="5" ry="3" fill="#5C3A21" transform="rotate(30 65 55)"/><ellipse cx="45" cy="70" rx="3" ry="2" fill="#5C3A21" transform="rotate(10 45 70)"/><ellipse cx="70" cy="30" rx="3" ry="2" fill="#5C3A21" transform="rotate(-40 70 30)"/><path d="M 20 35 C 30 25, 50 20, 70 25" stroke="#A06B3E" stroke-width="3" fill="none" stroke-linecap="round"/></svg></div>` 
          : `<div class="card-icon">${ach.icon}</div>`;

        var statusHtml = isUnlocked 
          ? `<div class="card-status status-unlocked">${t.ach_unlocked}</div>` 
          : `<div class="card-status status-locked">${t.ach_locked}</div>`;

        card.innerHTML = `${iconHtml}<div class="card-content"><div class="card-title">${ach.title}</div><div class="card-desc">${ach.desc}</div>${statusHtml}</div>`;
        achievementsList.appendChild(card);
      }
    }

    function renderRating() {
      var container = document.getElementById('leaderboardList');
      container.innerHTML = '';
      var row = document.createElement('div');
      row.className = 'rating-row';
      var avatarSrc = userPhoto ? userPhoto : 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="50" fill="%234c1d95"/><text x="50" y="62" font-size="40" text-anchor="middle" fill="white">🥔</text></svg>';
      
      row.innerHTML = '<div class="rating-rank">1</div><img class="rating-avatar" src="' + avatarSrc + '" alt=""><div class="rating-info"><div class="rating-name">' + userName + '</div><div class="rating-score">' + t.balance + ': ' + balance.toFixed(3) + ' ₽</div></div>';
      container.appendChild(row);
    }

    function loadUser() {
      var photo = '';
      try {
        if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
          var u = tg.initDataUnsafe.user;
          if (u.photo_url) photo = u.photo_url;
          if (u.username) userName = '@' + u.username;
          else if (u.first_name) userName = u.first_name;
        }
      } catch(e) {}

      if (!photo) photo = 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="50" fill="%234c1d95"/><text x="50" y="62" font-size="40" text-anchor="middle" fill="white">🥔</text></svg>';
      
      userPhoto = photo;
      document.getElementById('topAvatar').src = photo;
      document.getElementById('profileAvatar').src = photo;
      document.getElementById('profileName').innerText = userName;
    }

    function showScreen(name) {
      var screens = document.querySelectorAll('.screen');
      for (var s = 0; s < screens.length; s++) screens[s].classList.remove('active');
      var target = document.getElementById('screen-' + name);
      if (target) target.classList.add('active');

      var menuItems = document.querySelectorAll('.menu-item');
      for (var m = 0; m < menuItems.length; m++) {
        menuItems[m].classList.remove('active');
        if (menuItems[m].getAttribute('data-screen') === name) menuItems[m].classList.add('active');
      }
      
      if (name === 'achievements' || name === 'shop') {
        for (var m = 0; m < menuItems.length; m++) menuItems[m].classList.remove('active');
      }

      if (name === 'upgrades') renderUpgrades();
      if (name === 'quests') renderQuests();
      if (name === 'profile') loadUser();
      if (name === 'rating') renderRating();
      if (name === 'achievements') renderAchievements();
      if (name === 'shop') renderShop();
    }

    document.getElementById('openProfile').onclick = function() { showScreen('profile'); };
    
    var menuItems = document.querySelectorAll('.menu-item');
    for (var i = 0; i < menuItems.length; i++) {
      menuItems[i].onclick = function() { showScreen(this.getAttribute('data-screen')); };
    }

    document.getElementById('tabTap').onclick = function() {
      currentTab = 'tap'; this.classList.add('active'); document.getElementById('tabAuto').classList.remove('active'); renderUpgrades();
    };
    document.getElementById('tabAuto').onclick = function() {
      currentTab = 'auto'; this.classList.add('active'); document.getElementById('tabTap').classList.remove('active'); renderUpgrades();
    };

    window.withdrawMoney = function() {
      if (balance < 10) { alert(currentLang === 'ru' ? 'Минимум 10 ₽' : 'Minimum 10 ₽'); return; }
      alert((currentLang === 'ru' ? 'Вывод ' : 'Withdraw ') + balance.toFixed(2) + ' ₽ (test)');
      balance = 0; updateUI();
    };

    var devClickCount = 0;
    document.getElementById('devBtn').onclick = function() {
      devClickCount++;
      if (devClickCount >= 5) {
        balance += 1000; totalTaps += 20000; updateUI();
        alert(currentLang === 'ru' ? '+1000 ₽ и +20000 тапов для тестов!' : '+1000 ₽ and +20000 taps for tests!');
        devClickCount = 0;
      }
    };

    applyTranslations(); 
    loadUser();
    updateUI();
    updateAutoInfo();
    updatePotatoSkin(); 
    if (hasAutoclicker) startAutoclicker();
  </script>
</body>
</html>
